<!doctype html>
<html lang="es" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; }
      body { background: #A61C1C; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--base, #A61C1C); }
      #art { position: absolute; inset: 0; width: 1920px; height: 1080px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="24"
         data-width="1920" data-height="1080"
         data-composition-variables='{"base": "rojo"}'>
      <svg id="art" class="clip" data-start="0" data-duration="24" data-track-index="0"
           viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- The brandkit symbol, exactly: three tables, one stroke, one radius. -->
          <mask id="mk" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">
            <g id="sym">
              <path id="symp" d="M110 5H25A20 20 0 0 0 25 45H110M25 45A20 20 0 0 0 25 85H110"
                    fill="none" stroke="#fff" stroke-width="10"/>
            </g>
          </mask>
          <filter id="soft" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="2.2"/></filter>
        </defs>
        <g mask="url(#mk)">
          <rect id="fill" x="0" y="0" width="1920" height="1080" fill="#F6F3EE"/>
          <g id="photos" filter="url(#soft)">
            <image id="p0" href="assets/photos/01-bosque.jpg" x="-80" y="-60" width="2080" height="1200" preserveAspectRatio="xMidYMid slice" opacity="0"/>
            <image id="p1" href="assets/photos/02-casa.jpg"   x="-80" y="-60" width="2080" height="1200" preserveAspectRatio="xMidYMid slice" opacity="0"/>
            <image id="p2" href="assets/photos/04-mesa.jpg"   x="-80" y="-60" width="2080" height="1200" preserveAspectRatio="xMidYMid slice" opacity="0"/>
          </g>
        </g>
      </svg>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      (function () {
        var DUR = 24;
        var BASES = { rojo: "#A61C1C", carbon: "#191919" };
        var base = "rojo";
        try {
          var vars = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : null;
          if (vars && BASES[vars.base]) base = vars.base;
        } catch (e) {}
        document.getElementById("root").style.setProperty("--base", BASES[base]);
        document.body.style.background = BASES[base];

        var sym = document.getElementById("sym"), symp = document.getElementById("symp");
        var photos = document.getElementById("photos");
        var P = [document.getElementById("p0"), document.getElementById("p1"), document.getElementById("p2")];
        var LEN = symp.getTotalLength();
        symp.style.strokeDasharray = LEN + " " + LEN;

        // One state object, tweened; the SVG is written from it on every frame.
        // Small: the symbol at 3x, centre-right. Large: 12x, bleeding off the right
        // edge, its three tables 120 px thick and the left half of the frame clear.
        var S = { s: 3, cx: 1300, cy: 540, drift: 0, dash: LEN, o0: 0, o1: 0, o2: 0, pan: 0 };

        function apply() {
          var tx = S.cx + S.drift - 55 * S.s, ty = S.cy - 45 * S.s;
          sym.setAttribute("transform", "translate(" + tx.toFixed(2) + " " + ty.toFixed(2) + ") scale(" + S.s.toFixed(4) + ")");
          symp.style.strokeDashoffset = S.dash.toFixed(3);
          P[0].setAttribute("opacity", S.o0.toFixed(4));
          P[1].setAttribute("opacity", S.o1.toFixed(4));
          P[2].setAttribute("opacity", S.o2.toFixed(4));
          photos.setAttribute("transform", "translate(" + S.pan.toFixed(2) + " 0)");
        }

        var tl = gsap.timeline({ paused: true, onUpdate: apply });
        var E = "sine.inOut", G = "power2.inOut";

        // 0 — the stroke draws itself, top table first, in one line.
        tl.fromTo(S, { dash: LEN }, { dash: 0, duration: 2.8, ease: G }, 0.4);
        // 1 — it grows into a supergraphic and its tables open onto the photographs.
        tl.fromTo(S, { s: 3, cx: 1300 }, { s: 12, cx: 1520, duration: 4.4, ease: G }, 3.6);
        tl.fromTo(S, { o0: 0 }, { o0: 1, duration: 2.2, ease: E }, 5.2);
        // 2 — it rests, drifting left very slowly while the photographs change.
        tl.fromTo(S, { drift: 0 }, { drift: -70, duration: 11.0, ease: E }, 8.0);
        tl.fromTo(S, { pan: 0 }, { pan: -90, duration: 14.0, ease: "none" }, 5.2);
        tl.fromTo(S, { o1: 0 }, { o1: 1, duration: 1.8, ease: E }, 11.2);
        tl.fromTo(S, { o2: 0 }, { o2: 1, duration: 1.8, ease: E }, 15.0);
        // 3 — it gathers itself back to the small symbol, the photographs give way
        //     to the warm white, and the stroke erases itself the way it was drawn.
        tl.fromTo(S, { s: 12, cx: 1520, drift: -70 }, { s: 3, cx: 1300, drift: 0, duration: 3.6, ease: G, immediateRender: false }, 19.0);
        tl.fromTo(S, { o0: 1, o1: 1, o2: 1 }, { o0: 0, o1: 0, o2: 0, duration: 1.8, ease: E, immediateRender: false }, 19.2);
        tl.fromTo(S, { dash: 0 }, { dash: -LEN, duration: 1.6, ease: G, immediateRender: false }, 22.2);
        tl.set({}, {}, DUR);

        window.__timelines["main"] = tl;
        apply();
        tl.seek(0);
      })();
    </script>
  </body>
</html>
