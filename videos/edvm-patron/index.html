<!doctype html>
<html lang="es" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; }
      body { background: #A61C1C; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #A61C1C; }
      #art { position: absolute; inset: 0; width: 1920px; height: 1080px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20"
         data-width="1920" data-height="1080"
         data-composition-variables='{"tono": "blanco"}'>
      <svg id="art" class="clip" data-start="0" data-duration="20" data-track-index="0"
           viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Brandkit slide 34/40, «patrón fachada»: the «m» as cladding. One tile is
               the shape from the deck (240×90 units at 1.8x = 432×162 px), on a 480×200
               pitch, first one at x=51, y=20. -->
          <pattern id="fachada" patternUnits="userSpaceOnUse" x="51" y="20" width="480" height="200">
            <path id="m" d="M240 5H25A20 20 0 0 0 25 45H240M25 45A20 20 0 0 0 25 85H240"
                  transform="scale(1.8)" fill="none" stroke="#F6F3EE" stroke-width="10"/>
          </pattern>
          <!-- The rows come up out of the red and dissolve again at the top. -->
          <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0"    stop-color="#fff" stop-opacity="0"/>
            <stop offset="0.22" stop-color="#fff" stop-opacity="1"/>
            <stop offset="0.62" stop-color="#fff" stop-opacity="1"/>
            <stop offset="1"    stop-color="#fff" stop-opacity="0"/>
          </linearGradient>
          <mask id="mk" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">
            <rect width="1920" height="1080" fill="url(#fade)"/>
          </mask>
        </defs>
        <g mask="url(#mk)">
          <g id="scroll"><rect id="field" x="0" y="0" width="1920" height="1280" fill="url(#fachada)"/></g>
        </g>
      </svg>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      (function () {
        var DUR = 20, PITCH = 200, ROWS = 5;   // 5 rows of travel per loop: 50 px/s, exact loop
        var TONES = { blanco: "#F6F3EE", tono: "#8E1616" };
        var tono = "blanco";
        try {
          var vars = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : null;
          if (vars && TONES[vars.tono]) tono = vars.tono;
        } catch (e) {}
        document.getElementById("m").setAttribute("stroke", TONES[tono]);

        // Constant speed upward. The pattern repeats every 200 px, so the field moves
        // up one row every 4 s, five times: frame 600 is frame 0 and the loop is exact.
        var tl = gsap.timeline({ paused: true });
        tl.fromTo("#scroll", { y: 0 }, { y: -PITCH, duration: DUR / ROWS, ease: "none", repeat: ROWS - 1 }, 0);
        tl.set({}, {}, DUR);
        window.__timelines["main"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
