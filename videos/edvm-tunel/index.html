<!doctype html>
<html lang="es" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; }
      body { background: #F6F3EE; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #F6F3EE; }
      #art { position: absolute; inset: 0; width: 1920px; height: 1080px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20"
         data-width="1920" data-height="1080">
      <svg id="art" class="clip" data-start="0" data-duration="20" data-track-index="0"
           viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
        <g id="tunnel"></g>
      </svg>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      (function () {
        var DUR = 20;
        var PASSES = 6;          // six «m» flown through per loop: one every 3.33 s
        var R = 5;               // each «m» is 5x the next one: it sits inside the gap of the one before, with air around it
        var N = 5;               // how many are on screen at once
        var S0 = 0.30;           // scale of the furthest one
        var VX = 960, VY = 540;  // vanishing point: the centre of the frame
        // The camera aims at the gap between the top and middle tables of every «m»:
        // inner arc at x=25, tables end at x=110, gap from y=10 to y=40.
        var GX = 67.5, GY = 25;
        var D = "M110 5H25A20 20 0 0 0 25 45H110M25 45A20 20 0 0 0 25 85H110";

        var ns = "http://www.w3.org/2000/svg", g = document.getElementById("tunnel");
        var ms = [];
        for (var i = 0; i < N; i++) {
          var p = document.createElementNS(ns, "path");
          p.setAttribute("d", D); p.setAttribute("fill", "none");
          p.setAttribute("stroke", "#A61C1C"); p.setAttribute("stroke-width", "10");
          g.insertBefore(p, g.firstChild);   // the nearest one is drawn last, on top
          ms.push(p);
        }

        // Exponential zoom, so the speed of travel feels constant. Everything is a
        // function of how far along the tunnel we are, taken modulo one «m»: after
        // each pass the set of «m» is the same set shifted by one, so the loop is exact.
        var cam = { z: 0 };
        function apply() {
          var f = cam.z - Math.floor(cam.z);
          for (var k = 0; k < N; k++) {
            var s = S0 * Math.pow(R, k + f);
            var tx = VX - GX * s, ty = VY - GY * s;
            ms[k].setAttribute("transform", "translate(" + tx.toFixed(3) + " " + ty.toFixed(3) + ") scale(" + s.toFixed(5) + ")");
            // The furthest one fades up out of the beige as it arrives.
            var o = k === 0 ? f : 1;
            ms[k].setAttribute("opacity", (o * o * (3 - 2 * o)).toFixed(4));
          }
        }

        var tl = gsap.timeline({ paused: true, onUpdate: apply });
        tl.fromTo(cam, { z: 0 }, { z: PASSES, duration: DUR, ease: "none" }, 0);
        window.__timelines["main"] = tl;
        apply();
        tl.seek(0);
      })();
    </script>
  </body>
</html>
