<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>G·Madrid Balonmano — Forest Edition (1080×1920)</title>
    <link rel="stylesheet" href="../assets/forest.css" />
    <script src="../assets/vendor/gsap.min.js"></script>
    <script src="../assets/config.js"></script>
    <script src="../assets/star.js"></script>
    <script src="../assets/forest.js"></script>
    <script src="../assets/timeline.js"></script>
    <style>
      #root { position: relative; overflow: hidden; background: #071F1B; font-family: "Montserrat", sans-serif; }
      html, body { width: 1080px; height: 1920px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="forest" class="clip" data-layout-allow-overflow="true" data-start="0" data-duration="15" data-track-index="0" width="1080" height="1920"></canvas>
      <div id="textLayer" class="clip" data-start="0" data-duration="15" data-track-index="1">
        <div id="titleBox">
          <h1 id="title">FOREST EDITION</h1>
          <p id="season">TEMPORADA 26/27</p>
        </div>
        <div class="stage" id="heroStage">
          <div class="glow" id="heroGlow"></div>
          <img class="jersey" id="heroFront" src="../assets/product/home-front.png" alt="Equipación oficial 2026/27, frontal" />
          <img class="jersey" id="heroBack" src="../assets/product/home-back.png" alt="Equipación oficial 2026/27, espalda" />
        </div>
        <div class="card" id="card1"><img src="../assets/product/detail-fabric.jpg" alt="Detalle del tejido con hojas" /></div>
        <div class="card" id="card2"><img src="../assets/product/detail-crest.jpg" alt="Escudo G·Madrid y marca BKA" /></div>
        <div class="card" id="card3"><img src="../assets/product/detail-sleeve.jpg" alt="Manga Pride" /></div>
        <div class="stage" id="duoStage">
          <img class="jersey" id="duoGk" src="../assets/product/gk-front.png" alt="Equipación de portería 2026/27" />
          <img class="jersey" id="duoHome" src="../assets/product/home-front-duo.png" alt="Equipación oficial 2026/27" />
        </div>
        <p class="word" id="word1">NATURALEZA</p>
        <p class="word" id="word2">CRECIMIENTO</p>
        <p class="word" id="word3">DIVERSIDAD</p>
        <div class="stage" id="logoStage">
          <div class="plate" id="logoPlate"></div>
          <img id="logoStar" src="../assets/logo/gmadrid-logo-star.png" alt="Estrella G·Madrid" />
          <img id="logoText" src="../assets/logo/gmadrid-logo-text.png" alt="G·Madrid Balonmano" />
        </div>
      </div>
      <div id="fade" class="clip" data-start="0" data-duration="15" data-track-index="2"></div>
      <audio id="bgm" src="../assets/audio/forest-bgm.wav" data-start="0" data-duration="15" data-track-index="3" data-volume="1"></audio>
    </div>
    <script>
      window.buildForestFilm("main");
    </script>
  </body>
</html>
