<!doctype html>
<html lang="es" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
      body { background: #15181C; }
      #root { position: relative; width: 100%; height: 100%; background: #15181C; overflow: hidden; }

      /* .shot carries timing and is never animated.
         .rev carries the reveal, in SCREEN space — it must not inherit the camera.
         .ph  carries the camera.
         Splitting them is what lets eight wedges snap in around a fixed centre
         while the picture inside them is already travelling. */
      .shot { position: absolute; inset: 0; }
      .rev  { position: absolute; inset: 0; }
      .ph   { position: absolute; inset: 0; width: 1920px; height: 1080px; will-change: transform; }
      .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }

      .wash {
        position: absolute; inset: 0; pointer-events: none; --k: 0;
        background: linear-gradient(90deg,
          rgba(242,244,244,var(--k)) 0%, rgba(242,244,244,var(--k)) 48.96%,
          rgba(242,244,244,calc(var(--k) * 0.844)) 55.73%,
          rgba(242,244,244,calc(var(--k) * 0.5)) 62.50%,
          rgba(242,244,244,calc(var(--k) * 0.156)) 69.27%,
          rgba(242,244,244,0) 76.04%);
      }
      .scrim {
        position: absolute; inset: 0; display: none; pointer-events: none;
        background: linear-gradient(90deg,
          rgba(242,244,244,0.99) 0%, rgba(242,244,244,0.90) 20%, rgba(242,244,244,0.62) 34%,
          rgba(242,244,244,0.28) 50%, rgba(242,244,244,0.07) 66%, rgba(242,244,244,0) 100%);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="14.4"
         data-width="1920" data-height="1080"
         data-composition-variables='{"scrim": false, "legible": false}'>
      <div id="stage"></div>
      <div id="scrim" class="scrim"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      (function () {
        var W = 1920, H = 1080, FPS = 30;
        // Frame-aligned by design: 54 frames a beat, 16 frames a seam, and the
        // fan steps through its eight wedges at exactly 2 frames each, so no
        // eighth ever lands on a half frame.
        var BEAT = 54 / FPS;        // 1.800s
        var SEAM = 16 / FPS;        // 0.533s
        var TRAVEL = BEAT + SEAM;   // 2.333s — how long a photo is on screen
        var SPLICE = SEAM / TRAVEL;

        // Eight beats. Each photo runs twice, on a different framing and with the
        // camera going the other way, so the second pass never reads as a repeat.
        // Odd beats push in, even beats pull out: the film breathes in and out
        // eight times instead of drifting one way for fourteen seconds.
        var P = "assets/photos/";
        var BEATS = [
          { img: P+"01-amanecer.jpg",  s0:1.10, s1:1.30, ox:  0, oy:  0, dx:-46, dy: 16, rev:"fan", from:-90, cx:56, cy:42, k:0, kL:0.14 },
          { img: P+"03-llegada.jpg",   s0:1.30, s1:1.11, ox: 34, oy:-14, dx: 44, dy:-14, rev:"oct", ring:1,               k:0, kL:0.40 },
          { img: P+"02-desayuno.jpg",  s0:1.11, s1:1.30, ox:-30, oy: 12, dx:-48, dy: 14, rev:"fan", from:-45, cx:64, cy:56, k:0, kL:0.20 },
          { img: P+"04-piscina.jpg",   s0:1.30, s1:1.12, ox: 28, oy: 18, dx: 42, dy: 12, rev:"oct", ring:3,               k:0, kL:0.45 },
          { img: P+"01-amanecer.jpg",  s0:1.12, s1:1.30, ox: 40, oy:-20, dx: 46, dy:-16, rev:"fan", from:-90, cx:44, cy:60, k:0, kL:0.14 },
          { img: P+"03-llegada.jpg",   s0:1.30, s1:1.11, ox:-36, oy: 16, dx:-44, dy: 14, rev:"oct", ring:5,               k:0, kL:0.40 },
          { img: P+"02-desayuno.jpg",  s0:1.11, s1:1.30, ox: 32, oy:-16, dx: 46, dy:-12, rev:"fan", from:-45, cx:60, cy:38, k:0, kL:0.20 },
          { img: P+"04-piscina.jpg",   s0:1.30, s1:1.10, ox:-26, oy:-18, dx:-42, dy:-14, rev:"oct", ring:7,               k:0, kL:0.45 }
        ];

        function lerp(a, b, f) { return a + (b - a) * f; }

        // ---- The eighth, made kinetic. The image arrives as eight wedges that
        // snap in around the centre, two frames apart. It is the ring of eight
        // from the brandkit, performed instead of drawn.
        function fanMask(el, steps, from, cx, cy) {
          if (steps <= 0) { el.style.maskImage = "none"; el.style.webkitMaskImage = "none";
                            el.style.opacity = "0"; return; }
          el.style.opacity = "1";
          if (steps >= 8) { el.style.maskImage = "none"; el.style.webkitMaskImage = "none"; return; }
          var deg = steps * 45;
          var g = "conic-gradient(from " + from + "deg at " + cx + "% " + cy + "%, "
                + "#000 0deg " + deg + "deg, transparent " + deg + "deg 360deg)";
          el.style.maskImage = g; el.style.webkitMaskImage = g;
        }

        // ---- The octagon, kept from the brandkit's own rule that the shape
        // clips rather than outlines. Here it punches through fast.
        function octagon(cx, cy, R) {
          var pts = [];
          for (var k = 0; k < 8; k++) {
            var a = (22.5 + k * 45) * Math.PI / 180;
            pts.push((cx + R * Math.cos(a)).toFixed(2) + "px " + (cy + R * Math.sin(a)).toFixed(2) + "px");
          }
          return "polygon(" + pts.join(", ") + ")";
        }
        function coverRadius(cx, cy) {
          var far = 0, c = [[0,0],[W,0],[0,H],[W,H]];
          for (var i = 0; i < c.length; i++) {
            var dx = c[i][0] - cx, dy = c[i][1] - cy;
            far = Math.max(far, Math.sqrt(dx*dx + dy*dy));
          }
          // 14%: 2% geometry, the rest overshoot so coverage completes before the
          // beat boundary and the last rendered frame of the loop carries no sliver.
          return (far / Math.cos(22.5 * Math.PI / 180)) * 1.14;
        }
        var RCX = 1340, RCY = 540, RR = 250;
        function octant(step) {
          var a = (step * 45 - 90) * Math.PI / 180;
          return [RCX + RR * Math.cos(a), RCY + RR * Math.sin(a)];
        }

        // ---- Build the DOM: one layer per beat, plus a closing copy of beat 1
        // whose reveal lands on the very last frame. That copy is the loop.
        var stage = document.getElementById("stage");
        var layers = [];
        var order = BEATS.concat([BEATS[0]]);
        for (var i = 0; i < order.length; i++) {
          var b = order[i];
          var shot = document.createElement("div");
          shot.className = "clip shot";
          shot.setAttribute("data-start", "0");
          shot.setAttribute("data-duration", "14.4");
          shot.setAttribute("data-track-index", String(i));
          var rev = document.createElement("div"); rev.className = "rev"; rev.id = "rev" + i;
          var ph  = document.createElement("div"); ph.className  = "ph";  ph.id  = "ph"  + i;
          var im  = document.createElement("img"); im.id = "img" + i; im.src = b.img; im.alt = "";
          var wash = document.createElement("div"); wash.className = "wash";
          wash.dataset.k = String(b.k); wash.dataset.kL = String(b.kL);
          ph.appendChild(im); rev.appendChild(ph); rev.appendChild(wash); shot.appendChild(rev);
          stage.appendChild(shot);
          layers.push({ b: b, rev: rev, ph: ph });
        }

        var tl = gsap.timeline({ paused: true });

        function camera(ph, b, from, dur, f0, f1) {
          tl.fromTo(ph,
            { scale: lerp(b.s0, b.s1, f0), x: b.ox + lerp(0, b.dx, f0), y: b.oy + lerp(0, b.dy, f0) },
            { scale: lerp(b.s0, b.s1, f1), x: b.ox + lerp(0, b.dx, f1), y: b.oy + lerp(0, b.dy, f1),
              duration: dur, ease: "none" },
            from);
        }

        // Every fan is recomputed from the timeline clock on each update rather
        // than from a tween's own progress. A tween only fires its callbacks
        // while it is active, so seeking backwards past one would leave its mask
        // frozen open; driven from tl.time() the state is a pure function of the
        // frame, which is what frame-by-frame capture requires.
        var FANS = [];
        tl.eventCallback("onUpdate", function () {
          var t = tl.time(), step = SEAM / 8;
          for (var i = 0; i < FANS.length; i++) {
            var f = FANS[i];
            var n = Math.floor((t - f.at) / step + 1e-6);
            fanMask(f.rev, n < 0 ? 0 : (n > 8 ? 8 : n), f.b.from, f.b.cx, f.b.cy);
          }
        });

        function reveal(rev, b, at) {
          if (b.rev === "fan") {
            // Eight discrete steps. A stepped reveal is the point: the picture
            // does not slide in, it lands in eighths.
            // Started two frames early so the EIGHTH wedge lands two frames
            // before the beat boundary. Landing it ON the boundary means the
            // last rendered frame of the loop (14.367s, one frame short of 14.4)
            // still carries only seven eighths, and the loop splice jumps.
            FANS.push({ rev: rev, b: b, at: at - 2 / FPS });
          } else {
            var c = octant(b.ring);
            tl.fromTo(rev,
              { clipPath: octagon(c[0], c[1], 0) },
              { clipPath: octagon(c[0], c[1], coverRadius(c[0], c[1])), duration: SEAM, ease: "none" },
              at);
          }
        }

        // Beat 1 head: already SEAM into its travel at t=0, because its reveal
        // happened at the end of the previous loop.
        camera(layers[0].ph, BEATS[0], 0, TRAVEL - SEAM, SPLICE, 1);

        // Beats 2..8: the reveal LANDS on the beat boundary, so the incoming
        // picture is already moving before it is fully there.
        for (var n = 1; n < BEATS.length; n++) {
          var at = n * BEAT - SEAM;
          reveal(layers[n].rev, BEATS[n], at);
          camera(layers[n].ph, BEATS[n], at, TRAVEL, 0, 1);
        }

        // The closing copy of beat 1. Its reveal ends on the final frame, in
        // exactly the state the head layer holds on the first one.
        var endAt = BEATS.length * BEAT - SEAM;
        reveal(layers[BEATS.length].rev, BEATS[0], endAt);
        camera(layers[BEATS.length].ph, BEATS[0], endAt, SEAM, 0, SPLICE);

        // Static, decided once before the first frame.
        try {
          var vars = (window.__hyperframes && window.__hyperframes.getVariables)
            ? window.__hyperframes.getVariables() : null;
          if (vars && vars.scrim) document.getElementById("scrim").style.display = "block";
          var legible = !!(vars && vars.legible);
          var ws = document.querySelectorAll(".wash");
          for (var w = 0; w < ws.length; w++) {
            ws[w].style.setProperty("--k", legible ? ws[w].dataset.kL : ws[w].dataset.k);
          }
        } catch (e) {}

        // Layers 2..9 start hidden; their reveal brings them in.
        for (var z = 1; z < layers.length; z++) {
          if (layers[z].b.rev === "fan") fanMask(layers[z].rev, 0, layers[z].b.from, layers[z].b.cx, layers[z].b.cy);
        }

        window.__timelines["main"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
