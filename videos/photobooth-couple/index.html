<!DOCTYPE html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #050505; }
      #root { position: relative; width: 1920px; height: 1080px; background: #050505; overflow: hidden; }

      /* #cam carries the slow push-in for the whole booth sequence. It is never
         timed itself, so the video inside it can own its own data-start. */
      #cam { position: absolute; inset: 0; width: 1920px; height: 1080px; transform-origin: 50% 46%; }
      #cam video, #cam img {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        object-fit: cover; display: block;
      }

      #card { position: absolute; inset: 0; width: 1920px; height: 1080px; background: #050505; overflow: hidden; }
      #card-bg { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; display: block; }

      /* The four-frame photobooth strip. */
      #strip {
        position: absolute; left: 50%; top: 50%;
        width: 312px; height: 1048px; margin-left: -156px; margin-top: -524px;
        background: #efeeeb;
        padding: 16px 16px 56px;
        display: flex; flex-direction: column; gap: 16px;
        box-shadow: 0 40px 90px rgba(0, 0, 0, 0.75), 0 6px 18px rgba(0, 0, 0, 0.5);
        transform-origin: 50% 50%;
      }
      #strip .frame { width: 280px; height: 232px; display: block; object-fit: cover; background: #fff; }

      #fade { position: absolute; inset: 0; width: 1920px; height: 1080px; background: #000; opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-3rye" id="root" data-composition-id="main" data-start="0" data-duration="14.5" data-width="1920" data-height="1080">

      <!-- ── The booth: live footage with flash-frozen poses on top ───────── -->
      <div data-hf-id="hf-ftaq" id="cam">
        <video data-hf-id="hf-mgns" id="live" class="clip" src="assets/graded/booth.mp4" data-start="0" data-duration="9.95" data-media-start="0" data-track-index="0" muted playsinline></video>

        <img data-hf-id="hf-2q9q" id="hold-1" class="clip hold" src="assets/graded/hold-1.png" alt="" data-start="2.07" data-duration="0.5" data-track-index="1">
        <img data-hf-id="hf-psn5" id="hold-2" class="clip hold" src="assets/graded/hold-2.png" alt="" data-start="4.11" data-duration="0.5" data-track-index="1">
        <img data-hf-id="hf-5j2o" id="hold-3" class="clip hold" src="assets/graded/hold-3.png" alt="" data-start="6.16" data-duration="0.5" data-track-index="1">
        <img data-hf-id="hf-4so8" id="hold-4" class="clip hold" src="assets/graded/hold-4.png" alt="" data-start="7.35" data-duration="0.5" data-track-index="1">
        <img data-hf-id="hf-f0vq" id="hold-5" class="clip hold" src="assets/graded/hold-5.png" alt="" data-start="8.45" data-duration="0.5" data-track-index="1">
        <img data-hf-id="hf-2i65" id="hold-6" class="clip hold" src="assets/graded/hold-6.png" alt="" data-start="9.40" data-duration="0.55" data-track-index="1">
      </div>

      <!-- ── The strip comes out of the slot ─────────────────────────────── -->
      <div data-hf-id="hf-w6at" id="card" class="clip" data-start="9.95" data-duration="4.55" data-track-index="2">
        <img data-hf-id="hf-phpf" id="card-bg" src="assets/graded/card-bg.png" alt="">
        <div data-hf-id="hf-7js5" id="strip">
          <img data-hf-id="hf-ee5u" id="frame-1" class="frame" src="assets/graded/strip-1.png" alt="">
          <img data-hf-id="hf-my46" id="frame-2" class="frame" src="assets/graded/strip-2.png" alt="">
          <img data-hf-id="hf-l8w6" id="frame-3" class="frame" src="assets/graded/strip-3.png" alt="">
          <img data-hf-id="hf-iiaa" id="frame-4" class="frame" src="assets/graded/strip-4.png" alt="">
        </div>
      </div>

      <div data-hf-id="hf-128z" id="fade"></div>

      <!-- ── Flashes: one block instance per shutter, hit lands at 0.348s ── -->
      <div data-hf-id="hf-ssqe" id="flash-1" data-composition-id="editorial-flash-overlay" data-composition-src="compositions/editorial-flash-overlay.html" data-start="1.722" data-duration="0.6" data-width="1920" data-height="1080" data-track-index="5"></div>
      <div data-hf-id="hf-hciv" id="flash-2" data-composition-id="editorial-flash-overlay" data-composition-src="compositions/editorial-flash-overlay.html" data-start="3.762" data-duration="0.6" data-width="1920" data-height="1080" data-track-index="5"></div>
      <div data-hf-id="hf-aavq" id="flash-3" data-composition-id="editorial-flash-overlay" data-composition-src="compositions/editorial-flash-overlay.html" data-start="5.812" data-duration="0.6" data-width="1920" data-height="1080" data-track-index="5"></div>
      <div data-hf-id="hf-g368" id="flash-4" data-composition-id="editorial-flash-overlay" data-composition-src="compositions/editorial-flash-overlay.html" data-start="7.002" data-duration="0.6" data-width="1920" data-height="1080" data-track-index="5"></div>
      <div data-hf-id="hf-fuif" id="flash-5" data-composition-id="editorial-flash-overlay" data-composition-src="compositions/editorial-flash-overlay.html" data-start="8.102" data-duration="0.6" data-width="1920" data-height="1080" data-track-index="5"></div>
      <div data-hf-id="hf-urjy" id="flash-6" data-composition-id="editorial-flash-overlay" data-composition-src="compositions/editorial-flash-overlay.html" data-start="9.052" data-duration="0.6" data-width="1920" data-height="1080" data-track-index="6"></div>
      <div data-hf-id="hf-ir1n" id="flash-7" data-composition-id="editorial-flash-overlay" data-composition-src="compositions/editorial-flash-overlay.html" data-start="9.602" data-duration="0.6" data-width="1920" data-height="1080" data-track-index="5"></div>

      <!-- ── Sound: the clip's own music and three shutters, then ours ───── -->
      <audio data-hf-id="hf-y9k5" id="bed" src="assets/footage/photobooth.mp4" data-start="0" data-duration="9.95" data-media-start="0" data-track-index="10" data-volume="1"></audio>
      <audio data-hf-id="hf-xpgo" id="click-4" src="assets/sfx/shutter.wav" data-start="7.35" data-duration="0.3" data-track-index="11" data-volume="0.7"></audio>
      <audio data-hf-id="hf-4jxj" id="click-5" src="assets/sfx/shutter.wav" data-start="8.45" data-duration="0.3" data-track-index="11" data-volume="0.7"></audio>
      <audio data-hf-id="hf-ime4" id="click-6" src="assets/sfx/shutter.wav" data-start="9.40" data-duration="0.3" data-track-index="11" data-volume="0.7"></audio>
      <audio data-hf-id="hf-49ny" id="click-7" src="assets/sfx/shutter.wav" data-start="9.95" data-duration="0.3" data-track-index="12" data-volume="0.85"></audio>
      <audio data-hf-id="hf-mrv8" id="eject" src="assets/sfx/eject.wav" data-start="10.0" data-duration="1.4" data-track-index="13" data-volume="0.45"></audio>
    </div>

    <script>
      (function () {
        var tl = gsap.timeline({ paused: true });
        var FLASHES = [2.07, 4.11, 6.16, 7.35, 8.45, 9.40];
        var HOLDS = [0.5, 0.5, 0.5, 0.5, 0.5, 0.55];
        var CARD = 9.95;

        // Slow push into the booth across the whole live sequence.
        tl.fromTo("#cam", { scale: 1.0 }, { scale: 1.07, duration: CARD, ease: "none" }, 0);

        FLASHES.forEach(function (f, i) {
          var hold = "#hold-" + (i + 1);
          // Outgoing live picture blows out into the flash...
          tl.to("#live", { filter: "brightness(2.4)", duration: 0.12, ease: "power3.in" }, f - 0.12);
          // ...and is back to normal, hidden under the held pose, before it returns.
          tl.set("#live", { filter: "brightness(1)" }, f + 0.02);
          // The captured pose: overexposed on the hit, settling as the flash dies.
          tl.fromTo(hold, { filter: "brightness(2.2)" },
                          { filter: "brightness(1)", duration: 0.32, ease: "power2.out" }, f);
          tl.fromTo(hold, { scale: 1.06 }, { scale: 1.02, duration: HOLDS[i], ease: "power2.out" }, f);
        });

        tl.to("#bed", { volume: 0, duration: 0.45, ease: "power1.in" }, CARD - 0.45);

        // The strip slides up out of the slot, then each frame develops in turn.
        tl.fromTo("#card-bg", { opacity: 1, scale: 1.12 },
                              { opacity: 0.55, scale: 1.18, duration: 4.55, ease: "power1.out" }, CARD);
        tl.fromTo("#strip", { y: 1180, rotation: -1, scale: 0.92 },
                            { y: 12, rotation: -3, scale: 0.92, duration: 1.4, ease: "power3.out" }, CARD + 0.05);
        tl.to("#strip", { y: -6, scale: 0.95, duration: 3.1, ease: "sine.inOut" }, CARD + 1.45);
        [1, 2, 3, 4].forEach(function (n, i) {
          tl.fromTo("#frame-" + n, { filter: "brightness(3.2) contrast(0.6)" },
                                   { filter: "brightness(1) contrast(1)", duration: 1.1, ease: "power2.out" },
                    CARD + 0.7 + i * 0.42);
        });

        tl.to("#fade", { opacity: 1, duration: 0.6, ease: "power1.in" }, 13.9);

        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
