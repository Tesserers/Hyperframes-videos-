<!doctype html>
<html lang="es" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      /* Paleta Tessera 2027 y su único degradado (Teal 0 % a Navy 75 %). */
      :root { --navy: #202031; --navy-deep: #16161F; --teal: #587579; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
      body { background: var(--navy-deep); }
      #root { position: relative; width: 100%; height: 100%; background: var(--navy-deep); overflow: hidden; }

      .shot { position: absolute; inset: 0; overflow: hidden; background: var(--navy-deep); }
      .cam  { position: absolute; inset: 0; will-change: transform, filter; }
      /* Las fotos vienen un 15 % más grandes que el cuadro: la cámara se mueve sobre píxeles reales. */
      .cam > img.full { position: absolute; left: -144px; top: -81px; width: 2208px; height: 1242px; }

      /* Pantalla partida: paneles verticales con junta de 8 px en Navy profundo. */
      .pn { position: absolute; top: 0; height: 1080px; overflow: hidden; background: var(--navy-deep); }
      .pn img { position: absolute; top: -81px; height: 1242px; will-change: transform; }
      .p3 img { left: -48px; width: 736px; }
      .p2 img { left: -72px; width: 1104px; }

      /* Cortinilla con el degradado de marca, en diagonal. */
      .wipe { position: absolute; top: -20px; left: 0; width: 2600px; height: 1120px;
              background: linear-gradient(135deg, #587579 0%, #202031 75%); }

      #velo {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse 50% 62% at 50% 50%,
          rgba(32,32,49,0.76) 0%, rgba(32,32,49,0.68) 42%, rgba(32,32,49,0.36) 82%, rgba(32,32,49,0.20) 100%);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15"
         data-width="1920" data-height="1080"
         data-composition-variables='{"velo": true}'>
      <div id="stage"></div>
      <div class="clip" id="velo" data-start="0" data-duration="15" data-track-index="40" style="z-index:40"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      (function () {
        var A = "assets/spot/";
        var tl = gsap.timeline({ paused: true });
        var stage = document.getElementById("stage");
        var track = 0;

        // Velocidad de la cámara en el plano general de la oficina. El primer y el último plano
        // la comparten, así el bucle empalma en mitad de un mismo movimiento.
        var RATE_S = 0.04375, RATE_X = -17.5;   // escala / s y px / s

        function shot(start, dur, inner) {
          var d = document.createElement("div");
          d.className = "clip shot";
          d.setAttribute("data-start", start.toFixed(3));
          d.setAttribute("data-duration", dur.toFixed(3));
          d.setAttribute("data-track-index", String(track));
          d.setAttribute("data-layout-allow-overflow", "");
          d.style.zIndex = String(++track);
          d.innerHTML = '<div class="cam" data-layout-allow-overflow>' + inner + "</div>";
          stage.appendChild(d);
          return { el: d, cam: d.firstChild, start: start, dur: dur };
        }
        function full(name) { return '<img class="full" data-layout-allow-overflow src="' + A + "full-" + name + '.jpg" alt="">'; }
        function split(kind, names) {
          var n = names.length, w = 1920 / n, html = "";
          for (var i = 0; i < n; i++) {
            var x0 = i * w + (i ? 4 : 0), x1 = (i + 1) * w - (i < n - 1 ? 4 : 0);
            html += '<div class="pn ' + kind + '" data-layout-allow-overflow style="left:' + x0 + "px;width:" + (x1 - x0) + 'px">' +
                    '<img data-layout-allow-overflow src="' + A + kind + "-" + names[i] + '.jpg" alt=""></div>';
          }
          return html;
        }
        function move(el, from, to, at, dur, ease) {
          tl.fromTo(el, from, Object.assign({ duration: dur, ease: ease || "none", immediateRender: false }, to), at);
        }
        // Dentro de una pantalla partida cada panel se mueve a contrapelo del de al lado.
        function panelDrift(s, push) {
          var imgs = s.el.querySelectorAll(".pn img");
          for (var i = 0; i < imgs.length; i++) {
            var dir = i % 2 ? 1 : -1;
            gsap.set(imgs[i], { scale: 1.0, y: -30 * dir });
            move(imgs[i], { scale: 1.0, y: -30 * dir }, { scale: push || 1.06, y: 30 * dir }, s.start, s.dur, "none");
          }
        }
        function wipe(start, leftToRight) {
          // Entra hasta tapar el cuadro entero (0,3 s) y sigue de largo (0,3 s). El corte va debajo,
          // en el fotograma en que lo tapa todo.
          var w = document.createElement("div");
          w.className = "clip wipe";
          w.setAttribute("data-start", start.toFixed(3));
          w.setAttribute("data-duration", "0.6");
          w.setAttribute("data-track-index", String(30 + track));
          w.setAttribute("data-layout-allow-overflow", "");
          w.style.zIndex = "30";
          stage.appendChild(w);
          var a = leftToRight ? -2900 : 2240, m = -340, b = leftToRight ? 2240 : -2900;
          gsap.set(w, { x: a, skewX: -12 });
          move(w, { x: a }, { x: m }, start, 0.3, "power3.in");
          move(w, { x: m }, { x: b }, start + 0.3, 0.3, "power3.out");
        }

        // ---------------- Guion ----------------

        // 1 · Oficina TESSERA, plano general. Abre (y cierra) el bucle.
        var s1 = shot(0, 2.0, full("tesserers"));
        gsap.set(s1.cam, { scale: 1.05, x: 0 });
        move(s1.cam, { scale: 1.05, x: 0 }, { scale: 1.05 + RATE_S * 2.0, x: RATE_X * 2.0 }, 0, 2.0);

        // 2 · Pantalla partida en tres. Los paneles entran por arriba y por abajo, alternos,
        //     tapando el plano anterior.
        var s2 = shot(1.6, 1.0, split("p3", ["equipo-ella", "ciudad", "oficina"]));
        s2.el.style.background = "transparent";   // debajo tiene que seguir viéndose el plano 1
        var pns = s2.el.querySelectorAll(".pn");
        for (var i = 0; i < pns.length; i++) {
          var fromY = i % 2 ? -1080 : 1080;
          gsap.set(pns[i], { y: fromY });
          move(pns[i], { y: fromY }, { y: 0 }, 1.6 + i * 0.07, 0.4, "power4.out");
        }
        panelDrift(s2);
        // y sale atravesada por la cámara
        move(s2.cam, { scale: 1, filter: "blur(0px)" }, { scale: 1.35, filter: "blur(14px)" }, 2.4, 0.2, "power2.in");

        // 3 · Ciudad. Entra en pleno empuje y frena.
        var s3 = shot(2.4, 1.0, full("ciudad"));
        gsap.set(s3.el, { opacity: 0 });
        move(s3.el, { opacity: 0 }, { opacity: 1 }, 2.4, 0.18, "power1.out");
        gsap.set(s3.cam, { scale: 1.25, rotation: -1.5, filter: "blur(16px)" });
        move(s3.cam, { scale: 1.25, rotation: -1.5 }, { scale: 1.04, rotation: 0 }, 2.4, 1.0, "power3.out");
        move(s3.cam, { filter: "blur(16px)" }, { filter: "blur(0px)" }, 2.4, 0.25, "power2.out");

        // 4 · Corte seco a dos paneles: despacho y molinos.
        var s4 = shot(3.4, 0.6, split("p2", ["despacho", "molinos"]));
        panelDrift(s4, 1.08);

        // 5 · Reunión. Paneo lateral largo.
        var s5 = shot(4.0, 1.3, full("reunion"));
        gsap.set(s5.cam, { scale: 1.1, x: 70 });
        move(s5.cam, { scale: 1.1, x: 70 }, { scale: 1.12, x: -70 }, 4.0, 1.3);

        // Cortinilla de marca, de izquierda a derecha.
        wipe(5.0, true);

        // 6 · Molinos. La cámara se aleja y descubre el plano.
        var s6 = shot(5.3, 1.4, full("molinos"));
        gsap.set(s6.cam, { scale: 1.22 });
        move(s6.cam, { scale: 1.22 }, { scale: 1.02 }, 5.3, 1.4, "power2.out");

        // 7 · Tres paneles: Gran Vía, vuestro portátil, la reunión.
        var s7 = shot(6.7, 0.6, split("p3", ["granvia", "tesserers", "reunion"]));
        panelDrift(s7, 1.08);

        // 8 · Equipo. Empuje lento hacia las caras: el momento emocional.
        var s8 = shot(7.3, 1.6, full("equipo"));
        gsap.set(s8.cam, { scale: 1.0, transformOrigin: "50% 35%" });
        move(s8.cam, { scale: 1.0 }, { scale: 1.14 }, 7.3, 1.6, "power1.inOut");

        // 9 · Barrido rápido: equipo sale por la izquierda, la oficina entra por la derecha,
        //     como un único paneo de cámara.
        var s9 = shot(8.6, 1.5, full("oficina"));
        gsap.set(s9.el, { x: 1920 });
        move(s8.el, { x: 0 }, { x: -1920 }, 8.6, 0.3, "power2.inOut");
        move(s9.el, { x: 1920 }, { x: 0 }, 8.6, 0.3, "power2.inOut");
        move(s8.cam, { filter: "blur(0px)" }, { filter: "blur(30px)" }, 8.6, 0.15, "power2.in");
        gsap.set(s9.cam, { scale: 1.08, x: 0, filter: "blur(30px)" });
        move(s9.cam, { filter: "blur(30px)" }, { filter: "blur(0px)" }, 8.75, 0.15, "power2.out");
        move(s9.cam, { x: 0 }, { x: -70 }, 8.6, 1.5);

        // 10 · Arranca la ráfaga: los cortes se acortan hasta 0,4 s.
        var s10 = shot(10.1, 0.5, split("p2", ["ciudad", "despacho-b"]));
        panelDrift(s10, 1.08);
        var s11 = shot(10.6, 0.4, split("p3", ["molinos", "equipo-el", "granvia-b"]));
        panelDrift(s11, 1.08);
        var s12 = shot(11.0, 0.4, full("ciudad"));
        gsap.set(s12.cam, { scale: 1.3 });
        move(s12.cam, { scale: 1.3 }, { scale: 1.37 }, 11.0, 0.4);
        var s13 = shot(11.4, 0.4, full("reunion"));
        gsap.set(s13.cam, { scale: 1.28, transformOrigin: "45% 50%" });
        move(s13.cam, { scale: 1.28 }, { scale: 1.35 }, 11.4, 0.4);
        var s14 = shot(11.8, 0.5, full("equipo"));
        gsap.set(s14.cam, { scale: 1.3, transformOrigin: "40% 30%" });
        move(s14.cam, { scale: 1.3 }, { scale: 1.38 }, 11.8, 0.5);

        // Segunda cortinilla, ahora de derecha a izquierda.
        wipe(12.0, false);

        // 15 · Vuestro equipo en primer plano.
        var s15 = shot(12.3, 1.7, full("tesserers"));
        gsap.set(s15.cam, { scale: 1.3, x: 40, transformOrigin: "42% 38%" });
        move(s15.cam, { scale: 1.3, x: 40 }, { scale: 1.37, x: -20 }, 12.3, 1.7);

        // 16 · Corte al plano general. Su movimiento sigue en el plano 1: ahí empalma el bucle.
        var s16 = shot(14.0, 1.0, full("tesserers"));
        gsap.set(s16.cam, { scale: 1.05 - RATE_S, x: -RATE_X });
        move(s16.cam, { scale: 1.05 - RATE_S, x: -RATE_X }, { scale: 1.05, x: 0 }, 14.0, 1.0);

        try {
          var vars = (window.__hyperframes && window.__hyperframes.getVariables)
            ? window.__hyperframes.getVariables() : null;
          if (vars && vars.velo === false) document.getElementById("velo").style.display = "none";
        } catch (e) {}

        window.__timelines["main"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
