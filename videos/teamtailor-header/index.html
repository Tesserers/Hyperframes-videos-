<!doctype html>
<html lang="es" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      /* Paleta Tessera 2027, sin más colores que estos seis. */
      :root {
        --navy: #202031; --navy-deep: #16161F; --teal: #587579;
        --teal-light: #8AA3A5; --bruma: #E6ECEC; --white: #FFFFFF;
        /* El único degradado de la marca: Teal 0 % a Navy 75 %. */
        --grad-diag: linear-gradient(135deg, #587579 0%, #202031 75%);
        --grad-vert: linear-gradient(180deg, #587579 0%, #202031 75%);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
      body { background: var(--navy-deep); }
      #root { position: relative; width: 100%; height: 100%; background: var(--navy-deep); overflow: hidden; }

      #strip { position: absolute; left: 0; top: 0; height: 1080px; width: 5120px; will-change: transform; }
      .col  { position: absolute; top: 0; width: 320px; height: 1080px; }
      /* 8 px de junta navy profundo entre teselas: es un mosaico, se tiene que ver la junta. */
      .tile { position: absolute; left: 4px; width: 312px; overflow: hidden; }
      .tile.full { top: 0; height: 1080px; }
      .tile.top  { top: 0; height: 536px; }
      .tile.bot  { top: 544px; height: 536px; }

      .reel { position: absolute; left: 0; top: 0; width: 312px; will-change: transform; }
      .reel img { display: block; width: 312px; }

      .b-teal { background: var(--teal); }
      .b-navy { background: var(--navy); }
      .b-deep { background: var(--navy-deep); }
      .b-grad { background: var(--grad-diag); }
      .b-gradv { background: var(--grad-vert); }

      /* Formas de apoyo del brandbook (lámina 18): pequeñas, de acento. */
      .shape { position: absolute; left: 44px; overflow: visible; }
      .shape * { fill: none; stroke: var(--teal-light); stroke-width: 4; stroke-linecap: round; }
      .shape.w * { stroke: var(--white); }

      /* Velo Navy para que el título de la vacante se lea en blanco encima.
         Monocromo, de Navy a transparente: el tipo de velo que pide la lámina 20. */
      #velo {
        position: absolute; inset: 0; pointer-events: none;
        background:
          radial-gradient(ellipse 46% 52% at 50% 50%,
            rgba(32,32,49,0.66) 0%, rgba(32,32,49,0.58) 40%, rgba(32,32,49,0.30) 78%, rgba(32,32,49,0.18) 100%);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="16"
         data-width="1920" data-height="1080"
         data-composition-variables='{"velo": true}'>
      <div class="clip" id="mosaic" data-start="0" data-duration="16" data-track-index="0"
           style="position:absolute;inset:0">
        <div id="strip"></div>
      </div>
      <div class="clip" id="velo" data-start="0" data-duration="16" data-track-index="1"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      (function () {
        var LOOP = 16;              // s. Bucle exacto.
        var COLW = 320;             // ancho de columna, junta incluida
        var NCOL = 8;               // columnas por periodo
        var PERIOD = COLW * NCOL;   // 2560 px: más ancho que el cuadro, así nunca se ven dos copias de la misma tesela a la vez
        var SPEED = PERIOD / LOOP;  // 160 px/s, constante
        var FULL_H = 1080, HALF_H = 536;

        var PHOTOS = ["equipo", "oficina", "ciudad", "granvia"];
        var N = PHOTOS.length;

        // Cuatro relevos por bucle. Las teselas completas cambian a 2,7 / 6,7 / 10,7 / 14,7 s;
        // las medias, dos segundos antes. Siempre pasa algo cada dos segundos y cada zona
        // del cuadro cambia cada cuatro.
        var SWAPS = 4, BEAT = LOOP / SWAPS;
        var FULL_AT = 2.7, HALF_AT = 0.7;
        var SWAP_DUR = 0.8, WAVE = 0.36;   // el relevo cruza la pantalla de izquierda a derecha en 0,36 s

        // Columna a columna. slot = tesela de foto con la foto inicial (base) que le toca.
        // Las bases están escogidas para que dos teselas vecinas nunca enseñen la misma foto.
        var LAYOUT = [
          [{ pos: "full", photo: 0 }],
          [{ pos: "top", block: "b-teal", shape: "cross" }, { pos: "bot", photo: 3, half: true }],
          [{ pos: "full", block: "b-grad", shape: "pill" }],
          [{ pos: "full", photo: 1 }],
          [{ pos: "top", photo: 0, half: true }, { pos: "bot", block: "b-navy", shape: "wave" }],
          [{ pos: "full", photo: 2 }],
          [{ pos: "full", block: "b-deep", shape: "arc" }],
          [{ pos: "top", block: "b-gradv", shape: "bar" }, { pos: "bot", photo: 1, half: true }]
        ];

        var SHAPES = {
          // cruz, píldora, onda, arco y barra: las formas de la lámina 18
          cross: '<svg class="shape" width="44" height="44" viewBox="0 0 44 44" style="bottom:44px"><g class="spin" style="transform-origin:22px 22px"><path d="M22 4 V40 M4 22 H40"/></g></svg>',
          pill:  '<svg class="shape w" width="160" height="12" viewBox="0 0 160 12" style="bottom:52px"><path class="grow" d="M6 6 H50"/></svg>',
          wave:  '<svg class="shape" width="88" height="24" viewBox="0 0 88 24" style="bottom:48px"><defs><clipPath id="wc"><rect x="0" y="-4" width="88" height="32"/></clipPath></defs><g clip-path="url(#wc)"><path class="slide" d="M-44 12 q11 -10 22 0 t22 0 t22 0 t22 0 t22 0 t22 0 t22 0"/></g></svg>',
          arc:   '<svg class="shape" width="64" height="64" viewBox="0 0 64 64" style="bottom:40px"><g class="spin" style="transform-origin:32px 32px"><path d="M8 40 A24 24 0 0 1 56 40"/></g></svg>',
          bar:   '<svg class="shape w" width="12" height="120" viewBox="0 0 12 120" style="bottom:44px"><path class="grow" d="M6 114 V74"/></svg>'
        };

        var strip = document.getElementById("strip");
        var tl = gsap.timeline({ paused: true });

        // Cuándo pasa el relevo por una columna concreta: según dónde esté en pantalla
        // en ese momento, para que el cambio barra el cuadro de izquierda a derecha.
        function swapTime(colLeft, base, k) {
          var t0 = base + k * BEAT;
          var x = colLeft - SPEED * t0;
          var f = Math.min(Math.max(x / (1920 - COLW), 0), 1);
          return t0 + f * WAVE;
        }

        // Dos copias del periodo: la segunda entra por la derecha mientras la primera sale.
        // En t = 16 la tira ha avanzado exactamente un periodo y la copia 2 ocupa el sitio
        // que la copia 1 tenía en t = 0, en el mismo estado. Ahí cierra el bucle.
        for (var copy = 0; copy < 2; copy++) {
          for (var c = 0; c < NCOL; c++) {
            var left = (copy * NCOL + c) * COLW;
            var col = document.createElement("div");
            col.className = "col"; col.setAttribute("data-layout-allow-overflow", "");
            col.style.left = left + "px";
            strip.appendChild(col);

            LAYOUT[c].forEach(function (cell) {
              var tile = document.createElement("div");
              tile.setAttribute("data-layout-allow-overflow", ""); tile.className = "tile " + cell.pos + (cell.block ? " " + cell.block : "");
              col.appendChild(tile);

              if (cell.photo !== undefined) {
                var h = cell.half ? HALF_H : FULL_H;
                var reel = document.createElement("div");
                reel.className = "reel"; reel.setAttribute("data-layout-allow-overflow", "");
                // Cuatro fotos y la primera repetida al final: tras el cuarto relevo
                // la tesela vuelve a enseñar lo mismo que en t = 0.
                for (var i = 0; i <= SWAPS; i++) {
                  var im = document.createElement("img");
                  im.src = "assets/photos/" + PHOTOS[(cell.photo + i) % N] + (cell.half ? "-half" : "-full") + ".jpg";
                  im.alt = "";
                  im.style.height = h + "px";
                  reel.appendChild(im);
                }
                tile.appendChild(reel);
                var base = cell.half ? HALF_AT : FULL_AT;
                // Las teselas de abajo suben y las de arriba bajan, así en las columnas
                // partidas las dos mitades se cruzan en lugar de ir en bloque.
                var dir = cell.pos === "top" ? 1 : -1;
                if (dir === 1) {
                  // la tira se lee al revés: arranca enseñando la última imagen, que es la inicial
                  reel.style.transform = "translateY(" + (-SWAPS * h) + "px)";
                }
                for (var k = 0; k < SWAPS; k++) {
                  var at = swapTime(left, base, k);
                  var y0 = dir === -1 ? -k * h : -(SWAPS - k) * h;
                  var y1 = dir === -1 ? -(k + 1) * h : -(SWAPS - k - 1) * h;
                  tl.fromTo(reel, { y: y0 }, { y: y1, duration: SWAP_DUR, ease: "power3.inOut", immediateRender: k === 0 }, at);
                }
              } else if (cell.shape) {
                tile.insertAdjacentHTML("beforeend", SHAPES[cell.shape]);
                // La forma reacciona al mismo relevo que su columna: no se mueve por moverse.
                var sb = (c === 1 || c === 7) ? HALF_AT : FULL_AT;
                for (var s = 0; s < SWAPS; s++) {
                  var sat = swapTime(left, sb, s) + 0.15;
                  var ease = "power3.inOut";
                  if (cell.shape === "cross") {
                    tl.fromTo(tile.querySelector(".spin"), { rotation: 90 * s }, { rotation: 90 * (s + 1), duration: 0.7, ease: ease, immediateRender: s === 0 }, sat);
                  } else if (cell.shape === "arc") {
                    tl.fromTo(tile.querySelector(".spin"), { rotation: 180 * s }, { rotation: 180 * (s + 1), duration: 0.8, ease: ease, immediateRender: s === 0 }, sat);
                  } else if (cell.shape === "wave") {
                    tl.fromTo(tile.querySelector(".slide"), { x: 44 * s }, { x: 44 * (s + 1), duration: 0.8, ease: ease, immediateRender: s === 0 }, sat);
                  } else if (cell.shape === "pill") {
                    var long = s % 2 === 0;
                    tl.fromTo(tile.querySelector(".grow"), { attr: { d: long ? "M6 6 H50" : "M6 6 H154" } },
                      { attr: { d: long ? "M6 6 H154" : "M6 6 H50" }, duration: 0.8, ease: ease, immediateRender: s === 0 }, sat);
                  } else if (cell.shape === "bar") {
                    var tall = s % 2 === 0;
                    tl.fromTo(tile.querySelector(".grow"), { attr: { d: tall ? "M6 114 V74" : "M6 114 V6" } },
                      { attr: { d: tall ? "M6 114 V6" : "M6 114 V74" }, duration: 0.8, ease: ease, immediateRender: s === 0 }, sat);
                  }
                }
              }
            });
          }
        }

        // La tira avanza a velocidad constante todo el bucle.
        tl.fromTo(strip, { x: 0 }, { x: -PERIOD, duration: LOOP, ease: "none" }, 0);

        try {
          var vars = (window.__hyperframes && window.__hyperframes.getVariables)
            ? window.__hyperframes.getVariables() : null;
          if (vars && vars.velo === false) document.getElementById("velo").style.display = "none";
        } catch (e) {}

        window.__timelines["main"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
