<template>
  <style>
    @font-face { font-family: "Ailerons"; src: url("assets/fonts/Ailerons.otf") format("opentype"); font-weight: 400; font-style: normal; font-display: block; }
    @font-face { font-family: "Raleway"; src: url("assets/fonts/Raleway-200.woff2") format("woff2"); font-weight: 200; font-style: normal; font-display: block; }
    @font-face { font-family: "Raleway"; src: url("assets/fonts/Raleway-600.woff2") format("woff2"); font-weight: 600; font-style: normal; font-display: block; }
    @font-face { font-family: "Raleway"; src: url("assets/fonts/Raleway-800.woff2") format("woff2"); font-weight: 800; font-style: normal; font-display: block; }

    #root {
      position: absolute; inset: 0; overflow: hidden;
      --deep: #0a1a1c; --teal: #587579; --teal-lt: #6e9195;
      --beige: #f0e8de; --yellow: #fbe0a0;
    }
    /* No opaque ground here: the hoisted footage IS this frame's ground. */
    .ap-ground { position: absolute; inset: 0; background: transparent; }
    .ap-video { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; }
    .ap-overlay { position: absolute; inset: -140px; background: rgba(10, 26, 28, 0.54); }
    .ap-grain {
      position: absolute; inset: 0; opacity: 0.05; pointer-events: none; background-size: 200px;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
    }
    .ap-scrollbar { position: absolute; top: 0; left: 0; height: 3px; width: 1920px; background: var(--teal); transform-origin: left center; }

    .ap-stage { position: absolute; inset: 0; }

    /* The site's own reveal: a clipped box, the glyph slid up from under its own
       bottom edge. Every text entrance in this film uses it — never a fade-up. */
    .msk { display: inline-block; overflow: hidden; vertical-align: bottom; padding-bottom: 0.16em; margin-bottom: -0.16em; }
    .msk > span { display: inline-block; }
    .msk-caps { padding-bottom: 0.02em; margin-bottom: -0.02em; }

    .ap-wordmark {
      position: absolute; left: 0; top: 402px; width: 1920px; text-align: center;
      font-family: "Ailerons", sans-serif; font-weight: 400; font-size: 202px; line-height: 1;
      text-transform: uppercase; color: var(--beige); letter-spacing: 0.06em;
    }
    .ap-eyebrow {
      position: absolute; left: 0; top: 700px; width: 1920px; text-align: center;
      font-family: "Raleway", sans-serif; font-weight: 600; font-size: 26px;
      letter-spacing: 0.28em; text-transform: uppercase; color: rgba(240,232,222,0.86);
    }

    .ap-hook { position: absolute; left: 0; top: 322px; width: 1920px; text-align: center; }
    .ap-l { display: block; font-family: "Raleway", sans-serif; line-height: 1.0; letter-spacing: 0.01em; }
    .ap-l1 { font-weight: 200; font-size: 146px; color: var(--beige); }
    .ap-l2 { font-weight: 800; font-size: 146px; color: var(--yellow); }
    /* A shaped scrim, not a flat veil: it darkens only where the type sits, so the
       corners keep the client's footage and the brand teal still passes contrast. */
    .ap-scrim { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 70% 54% at 50% 50%, rgba(10,26,28,0.92) 0%, rgba(10,26,28,0.60) 62%, rgba(10,26,28,0) 84%); }
  </style>

  <div id="root" data-composition-id="01-apertura" data-width="1920" data-height="1080" data-duration="7.5">
    <div id="ap-ground" class="clip ap-ground" data-start="0" data-duration="7.5" data-track-index="0"></div>

    <!-- approved frame video hoisted by assemble-index -->

    <div id="ap-treat" class="clip ap-treat" data-start="0" data-duration="7.5" data-track-index="2">
      <div class="ap-overlay" id="ap-overlay"></div>
      <div class="ap-grain"></div>
      <div class="ap-scrollbar" id="ap-scrollbar"></div>
    </div>

    <div id="ap-mark" class="clip ap-stage" data-start="0" data-duration="7.5" data-track-index="3">
      <div class="ap-scrim"></div>
      <div class="ap-wordmark" id="ap-wordmark"></div>
      <div class="ap-eyebrow" id="ap-eyebrow"></div>
    </div>

    <div id="ap-hook" class="clip ap-hook" style="opacity:0;visibility:hidden" data-start="0" data-duration="7.5" data-track-index="4">
      <div class="ap-scrim"></div>
      <span class="ap-l ap-l1" id="ap-l1"></span>
      <span class="ap-l ap-l2" id="ap-l2"></span>
    </div>
  </div>

  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="01-apertura"]');
      function maskWords(el, text) {
        var inners = [], parts = text.split(" ");
        for (var i = 0; i < parts.length; i++) {
          var w = document.createElement("span"); w.className = "msk"; w.setAttribute("data-layout-allow-overlap", "");
          var s = document.createElement("span"); s.textContent = parts[i];
          w.appendChild(s); el.appendChild(w);
          if (i < parts.length - 1) el.appendChild(document.createTextNode(" "));
          inners.push(s);
        }
        return inners;
      }
      function maskChars(el, text) {
        var inners = [];
        for (var i = 0; i < text.length; i++) {
          var w = document.createElement("span"); w.className = "msk msk-caps"; w.setAttribute("data-layout-allow-overlap", "");
          var s = document.createElement("span"); s.textContent = text[i];
          w.appendChild(s); el.appendChild(w);
          inners.push(s);
        }
        return inners;
      }

      var glyphs = maskChars(root.querySelector("#ap-wordmark"), "Tessera");
      var eyebrow = maskWords(root.querySelector("#ap-eyebrow"), "Finanzas · Capital Humano · Estrategia");
      var w1 = maskWords(root.querySelector("#ap-l1"), "Las decisiones que");
      var w2 = maskWords(root.querySelector("#ap-l2"), "definen tu empresa.");

      var markStage = root.querySelector("#ap-mark");
      var hookStage = root.querySelector("#ap-hook");
      var overlay = root.querySelector("#ap-overlay");

      var tl = gsap.timeline({ paused: true });

      // Camera with intent: the stage arrives wide and decelerates onto the mark,
      // so the frame is alive from frame one and calm by the time it has to read.
      tl.fromTo(markStage, { scale: 1.09, y: 24 }, { scale: 1, y: 0, duration: 3.2, ease: "power2.out" }, 0);
      // Parallax — the veil travels against the stage, which is what gives a flat
      // vector composition depth over a moving plate.
      tl.fromTo(overlay, { x: -52 }, { x: 46, duration: 7, ease: "none" }, 0);

      // The logotype wipes up out of its own baseline, glyph by glyph, while the
      // tracking opens to the 0.06em of the supplied mark.
      var TIGHTEN = 44;
      for (var k = 0; k < glyphs.length; k++) {
        tl.fromTo(glyphs[k], { yPercent: 118 }, { yPercent: 0, duration: 0.92, ease: "expo.out" }, 0.1 + k * 0.055);
        tl.fromTo(
          glyphs[k].parentNode,
          { x: (k - (glyphs.length - 1) / 2) * TIGHTEN },
          { x: 0, duration: 1.5, ease: "expo.out" },
          0.1 + k * 0.055
        );
      }
      tl.fromTo(root.querySelector("#ap-scrollbar"), { scaleX: 0 }, { scaleX: 1, duration: 3.1, ease: "power2.inOut" }, 0);
      tl.fromTo(eyebrow, { yPercent: 118 }, { yPercent: 0, duration: 0.7, ease: "expo.out", stagger: 0.03 }, 1.3);

      // Internal seam (3.36): zoom-through. The mark accelerates at the viewer and
      // the claim continues that same forward Z from behind — one move, two texts.
      tl.to(markStage, { scale: 1.34, filter: "blur(10px)", duration: 0.24, ease: "power3.in" }, 3.36);
      tl.to(markStage, { opacity: 0.12, duration: 0.24, ease: "none" }, 3.36);
      tl.set(markStage, { autoAlpha: 0 }, 3.6);
      tl.set(hookStage, { autoAlpha: 1, scale: 0.74, filter: "blur(10px)", opacity: 0.12 }, 3.6);
      tl.to(hookStage, { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.56, ease: "expo.out" }, 3.6);
      // The camera keeps travelling through the second half — it never parks.
      tl.to(hookStage, { scale: 1.04, y: -16, duration: 2.6, ease: "power1.out" }, 4.3);

      tl.fromTo(w1, { yPercent: 118 }, { yPercent: 0, duration: 0.86, ease: "expo.out", stagger: 0.07 }, 3.68);
      tl.fromTo(w2, { yPercent: 118 }, { yPercent: 0, duration: 0.9, ease: "expo.out", stagger: 0.075 }, 4.26);

      window.__timelines["01-apertura"] = tl;
    })();
  </script>
</template>
