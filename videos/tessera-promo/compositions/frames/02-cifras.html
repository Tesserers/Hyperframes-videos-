<template>
  <style>
    @font-face { font-family: "Raleway"; src: url("assets/fonts/Raleway-200.woff2") format("woff2"); font-weight: 200; font-style: normal; font-display: block; }
    @font-face { font-family: "Raleway"; src: url("assets/fonts/Raleway-600.woff2") format("woff2"); font-weight: 600; font-style: normal; font-display: block; }
    @font-face { font-family: "Raleway"; src: url("assets/fonts/Raleway-800.woff2") format("woff2"); font-weight: 800; font-style: normal; font-display: block; }
    @font-face { font-family: "Manrope"; src: url("assets/fonts/Manrope-200.woff2") format("woff2"); font-weight: 200; font-style: normal; font-display: block; }
    @font-face { font-family: "Manrope"; src: url("assets/fonts/Manrope-800.woff2") format("woff2"); font-weight: 800; font-style: normal; font-display: block; }

    #root {
      position: absolute; inset: 0; overflow: hidden;
      --navy: #202031; --teal: #587579; --teal-lt: #6e9195;
      --beige: #f0e8de; --yellow: #fbe0a0;
    }
    .cf-ground { position: absolute; inset: 0; background: var(--navy); }
    /* The site's radial glow, the one device it uses to lift a dark panel. */
    .cf-glow {
      position: absolute; left: 260px; top: -180px; width: 1400px; height: 1100px;
      background: radial-gradient(circle, rgba(88,117,121,0.30) 0%, transparent 68%);
    }
    .cf-grain {
      position: absolute; inset: 0; opacity: 0.04; background-size: 200px;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
    }

    .cf-label {
      position: absolute; left: 130px; top: 104px;
      font-family: "Raleway", sans-serif; font-weight: 600; font-size: 24px;
      letter-spacing: 0.28em; text-transform: uppercase; color: var(--teal-lt);
    }

    .cf-row { position: absolute; left: 130px; top: 268px; width: 1660px; height: 300px; }
    .cf-stat { position: absolute; top: 0; width: 500px; }
    .cf-s1 { left: 0; }
    .cf-s2 { left: 616px; }
    .cf-s3 { left: 1216px; }
    .cf-num {
      font-family: "Manrope", sans-serif; font-weight: 200; font-size: 176px; line-height: 1;
      color: var(--beige); letter-spacing: -0.035em; white-space: nowrap;
    }
    .cf-num b { font-weight: 200; }
    .cf-unit { font-weight: 800; font-size: 112px; color: var(--yellow); }
    .cf-rule { margin-top: 30px; width: 420px; height: 2px; background: var(--teal); transform-origin: left center; }
    .cf-cap {
      margin-top: 22px;
      font-family: "Raleway", sans-serif; font-weight: 600; font-size: 25px;
      letter-spacing: 0.2em; text-transform: uppercase; color: rgba(240,232,222,0.62);
    }

    .cf-lines { position: absolute; left: 130px; top: 700px; width: 1660px; }
    .cf-line {
      display: block; font-family: "Raleway", sans-serif; font-size: 62px; line-height: 1.28;
      letter-spacing: 0.01em;
    }
    .cf-line-a { font-weight: 200; color: var(--beige); }
    .cf-line-b { font-weight: 200; color: rgba(240,232,222,0.66); }
    .cf-line-b em { font-style: normal; font-weight: 800; color: var(--yellow); }
    
    .msk { display: inline-block; overflow: hidden; vertical-align: bottom; padding-bottom: 0.16em; margin-bottom: -0.16em; }
    .msk > span { display: inline-block; }
  </style>

  <div id="root" data-composition-id="02-cifras" data-width="1920" data-height="1080" data-duration="7.5">
    <div id="cf-ground" class="clip cf-ground" data-start="0" data-duration="7.5" data-track-index="0">
      <div class="cf-glow" id="cf-glow"></div>
      <div class="cf-grain"></div>
    </div>

    <div id="cf-label" class="clip cf-label" data-start="0" data-duration="7.5" data-track-index="1">Trayectoria</div>

    <div id="cf-row" class="clip cf-row" data-start="0" data-duration="7.5" data-track-index="2">
      <div class="cf-stat cf-s1" id="cf-s1">
        <div class="cf-num">+€<b id="cf-n1">0</b><span class="cf-unit">M</span></div>
        <div class="cf-rule" id="cf-r1"></div>
        <div class="cf-cap">Asesorados</div>
      </div>
      <div class="cf-stat cf-s2" id="cf-s2">
        <div class="cf-num">+<b id="cf-n2">0</b></div>
        <div class="cf-rule" id="cf-r2"></div>
        <div class="cf-cap">Operaciones</div>
      </div>
      <div class="cf-stat cf-s3" id="cf-s3">
        <div class="cf-num">+<b id="cf-n3">0</b><span class="cf-unit"> años</span></div>
        <div class="cf-rule" id="cf-r3"></div>
        <div class="cf-cap">De experiencia</div>
      </div>
    </div>

    <div id="cf-lines" class="clip cf-lines" data-start="0" data-duration="7.5" data-track-index="3">
      <span class="cf-line cf-line-a" id="cf-la"></span>
      <span class="cf-line cf-line-b" id="cf-lb"></span>
    </div>
  </div>

  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="02-cifras"]');
      function maskWords(el, text) {
        var inners = [], parts = text.split(" ");
        for (var i = 0; i < parts.length; i++) {
          var w = document.createElement("span"); w.className = "msk";
          var s = document.createElement("span");
          if (parts[i].charAt(0) === "*") { var em = document.createElement("em"); em.textContent = parts[i].slice(1); s.appendChild(em); }
          else s.textContent = parts[i];
          w.appendChild(s); el.appendChild(w);
          if (i < parts.length - 1) el.appendChild(document.createTextNode(" "));
          inners.push(s);
        }
        return inners;
      }
      var la = maskWords(root.querySelector("#cf-la"), "La profundidad de una gran firma.");
      var lb = maskWords(root.querySelector("#cf-lb"), "La cercanía de un equipo que *se *sienta *en *tu *mesa.");

      var row = root.querySelector("#cf-row");
      var labelEl = root.querySelector("#cf-label");
      var labelTxt = labelEl.textContent; labelEl.textContent = "";
      var labelInner = maskWords(labelEl, labelTxt);
      var stats = [root.querySelector("#cf-s1"), root.querySelector("#cf-s2"), root.querySelector("#cf-s3")];
      var rules = [root.querySelector("#cf-r1"), root.querySelector("#cf-r2"), root.querySelector("#cf-r3")];
      var nums = [root.querySelector("#cf-n1"), root.querySelector("#cf-n2"), root.querySelector("#cf-n3")];
      var TARGETS = [500, 40, 15];
      var CUES = [0.34, 1.32, 2.3];

      var tl = gsap.timeline({ paused: true });

      // Camera with intent on the whole row, decelerating; the glow travels the
      // other way, so figures and ground never move as one flat plane.
      tl.fromTo(row, { scale: 1.07, x: 60 }, { scale: 1, x: 0, duration: 3.4, ease: "power2.out" }, 0);
      tl.fromTo(root.querySelector("#cf-glow"), { x: 140, autoAlpha: 0.5 }, { x: -110, autoAlpha: 1, duration: 7.4, ease: "none" }, 0);
      tl.fromTo(labelInner, { yPercent: 118 }, { yPercent: 0, duration: 0.7, ease: "expo.out" }, 0.05);

      // Three verified figures, one per beat. The count IS the motion.
      for (var i = 0; i < 3; i++) {
        (function (i) {
          var counter = { v: 0 }, el = nums[i];
          tl.fromTo(stats[i], { autoAlpha: 0, yPercent: 30, scale: 0.9 }, { autoAlpha: 1, yPercent: 0, scale: 1, duration: 0.72, ease: "expo.out" }, CUES[i]);
          tl.to(counter, {
            v: TARGETS[i], duration: 0.86, ease: "power2.out",
            onUpdate: function () { el.textContent = String(Math.round(counter.v)); },
          }, CUES[i] + 0.04);
          tl.fromTo(rules[i], { scaleX: 0 }, { scaleX: 1, duration: 0.62, ease: "power3.out" }, CUES[i] + 0.42);
        })(i);
      }

      // The site's own hero sub-line closes the beat — the promise the figures earn.
      // The nudge: the whole figure row slides up and out of the way as the claim
      // arrives — a group reposition, not a cut.
      tl.to(row, { y: -40, duration: 0.9, ease: "power3.inOut" }, 3.5);
      tl.fromTo(la, { yPercent: 118 }, { yPercent: 0, duration: 0.8, ease: "expo.out", stagger: 0.045 }, 3.62);
      tl.fromTo(lb, { yPercent: 118 }, { yPercent: 0, duration: 0.8, ease: "expo.out", stagger: 0.04 }, 4.5);

      window.__timelines["02-cifras"] = tl;
    })();
  </script>
</template>
