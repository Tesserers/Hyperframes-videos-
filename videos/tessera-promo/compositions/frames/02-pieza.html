<template>
  <style>
    @font-face { font-family: "Newsreader"; src: url("assets/fonts/Newsreader-400.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: block; }
    @font-face { font-family: "Hanken Grotesk"; src: url("assets/fonts/HankenGrotesk-400.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: block; }
    @font-face { font-family: "Hanken Grotesk"; src: url("assets/fonts/HankenGrotesk-600.woff2") format("woff2"); font-weight: 600; font-style: normal; font-display: block; }
    @font-face { font-family: "DM Mono"; src: url("assets/fonts/DMMono-400.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: block; }

    #root {
      position: absolute;
      inset: 0;

      overflow: hidden;
      --paper: #f0ebde;
      --ink: #1f2be0;
      --grid: rgba(31, 43, 224, 0.1);
    }

    .pza-ground {
      position: absolute;
      inset: 0;

      background-image: linear-gradient(to right, var(--grid) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
      background-size: 38.4px 38.4px;
    }
    .pza-rule { position: absolute; left: 77px; width: 1766px; height: 2px; background: var(--ink); }
    .pza-rule-top { top: 61px; }
    .pza-rule-bot { top: 1019px; }
    .pza-chrome {
      position: absolute; left: 77px; top: 79px;
      font-family: "DM Mono", monospace; font-size: 22px; letter-spacing: 0.06em; color: var(--ink);
    }

    .pza-mosaic { position: absolute; left: 577px; top: 350px; width: 766px; height: 506px; }
    .pza-tile { position: absolute; width: 116px; height: 116px; background: var(--ink); }
    .pza-tile.soft { opacity: 0.55; }
    .pza-hole { position: absolute; width: 116px; height: 116px; border: 5px solid var(--ink); }

    /* The incoming tesserа — an 8x8 qr-block whose cells become the wordmark. */
    .pza-piece { position: absolute; left: 967px; top: 480px; width: 116px; height: 116px; }
    .pza-cell { position: absolute; width: 14.5px; height: 14.5px; background: var(--ink); }

    .pza-wordmark {
      position: absolute; left: 0; top: 210px; width: 1920px;
      text-align: center;
      font-family: "Newsreader", serif; font-weight: 400; font-size: 200px; line-height: 0.9;
      letter-spacing: -0.008em; color: var(--ink);
    }
    .pza-labels { position: absolute; left: 0; top: 560px; width: 1920px; }
    .pza-label {
      position: absolute; left: 0; width: 1920px;

      font-family: "Hanken Grotesk", sans-serif; font-weight: 600; font-size: 46px;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink);
    }
    .pza-label-1 { top: 0; }

    .pza-bullet { width: 34px; height: 34px; background: var(--ink); flex: 0 0 auto; }
  </style>

  <div id="root" data-composition-id="02-pieza" data-width="1920" data-height="1080" data-duration="7.36">
    <div id="pza-ground" class="clip pza-ground" data-start="0" data-duration="7.36" data-track-index="0"></div>

    <div id="pza-furniture" class="clip pza-furniture" data-start="0" data-duration="7.36" data-track-index="1">
      <div class="pza-rule pza-rule-top"></div>
      <div class="pza-rule pza-rule-bot"></div>
      <div class="pza-chrome">TESSERA &middot; MADRID</div>
    </div>

    <div id="pza-mosaic" class="clip pza-mosaic" data-start="0" data-duration="7.36" data-track-index="2"></div>
    <div id="pza-piece" class="clip pza-piece" data-start="0" data-duration="7.36" data-track-index="3"></div>

    <div id="pza-wordmark" class="clip pza-wordmark" data-start="0" data-duration="7.36" data-track-index="4">TESSERA</div>

    <div id="pza-labels" class="clip pza-labels" data-start="0" data-duration="7.36" data-track-index="5">
      <div class="pza-label pza-label-1"><span class="pza-bullet"></span><span>Dirección financiera</span></div>
      <div class="pza-label pza-label-2"><span class="pza-bullet"></span><span>Capital humano</span></div>
    </div>
  </div>

  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="02-pieza"]');
      var TILE = 116, GAP = 14, COLS = 6, ROWS = 4;
      var HOLE_A = 1 * COLS + 3; // the cell the incoming tessera fills
      var HOLE_B = 2 * COLS + 1; // still open until frame 6

      var mosaic = root.querySelector(".pza-mosaic");
      var neighbours = [];
      var others = [];
      for (var r = 0; r < ROWS; r++) {
        for (var c = 0; c < COLS; c++) {
          var i = r * COLS + c;
          var x = c * (TILE + GAP), y = r * (TILE + GAP);
          var el;
          if (i === HOLE_A || i === HOLE_B) {
            el = document.createElement("div");
            el.className = "pza-hole";
            if (i === HOLE_A) el.style.visibility = "hidden";
          } else {
            el = document.createElement("div");
            el.className = "pza-tile" + ((r * 5 + c * 3) % 7 === 1 ? " soft" : "");
          }
          el.style.left = x + "px";
          el.style.top = y + "px";
          mosaic.appendChild(el);
          // Manhattan neighbours of the impact cell recoil; everything else holds.
          var dr = Math.abs(r - 1), dc = Math.abs(c - 3);
          if (i !== HOLE_A && dr + dc <= 2 && dr + dc > 0) neighbours.push({ el: el, d: dr + dc });
          else if (i !== HOLE_A) others.push(el);
        }
      }
      neighbours.sort(function (a, b) { return a.d - b.d; });

      // The incoming piece: an 8x8 qr-block, deterministic pattern, no randomness.
      var piece = root.querySelector(".pza-piece");
      var cells = [];
      for (var cr = 0; cr < 8; cr++) {
        for (var cc = 0; cc < 8; cc++) {
          var cell = document.createElement("div");
          cell.className = "pza-cell";
          cell.style.left = cr * 14.5 + "px";
          cell.style.top = cc * 14.5 + "px";
          // A dense but readable qr texture: ~70% on.
          cell.style.opacity = (cr * 3 + cc * 5) % 7 === 2 ? "0.25" : "1";
          piece.appendChild(cell);
          cells.push(cell);
        }
      }

      var wordmark = root.querySelector(".pza-wordmark");
      var labels = root.querySelectorAll(".pza-label");
      var tl = gsap.timeline({ paused: true });

      tl.set([wordmark], { autoAlpha: 0 }, 0);
      tl.set(labels, { autoAlpha: 0 }, 0);

      // — Scene 1 (0.00–1.71): the mosaic carries the LEFT current in, still braking;
      //   the missing tessera flies in from off-screen left and SNAPS into its cell. —
      tl.fromTo(mosaic, { x: 96 }, { x: 0, duration: 0.62, ease: "power3.out" }, 0);
      tl.fromTo(
        piece,
        { x: -1500, autoAlpha: 1, filter: "blur(12px)" },
        { x: 0, filter: "blur(0px)", duration: 0.72, ease: "power3.out" },
        0.24
      );
      // Impact recoil — same frame as the snap, magnitude falling with distance.
      for (var n = 0; n < neighbours.length; n++) {
        var nb = neighbours[n];
        var push = nb.d === 1 ? 9 : 4;
        tl.to(nb.el, { x: push, duration: 0.1, ease: "power2.out" }, 0.96 + (nb.d - 1) * 0.05);
        tl.to(nb.el, { x: 0, duration: 0.42, ease: "power3.out" }, 1.06 + (nb.d - 1) * 0.05);
      }

      // — Scene 2 (1.71–2.10): the dramatic comma. Nothing moves. —

      // — Scene 3 (2.10–4.15): the piece scales toward the viewer and hands off to
      //   the wordmark at the same centre (scale-swap); the labels land on their cues. —
      tl.to(mosaic, { opacity: 0.08, duration: 0.4, ease: "power2.out" }, 2.1);
      tl.to(piece, { x: -65, y: -110, scale: 3.6, duration: 0.5, ease: "power3.in" }, 2.1);
      tl.to(cells, { opacity: 0, duration: 0.22, ease: "none", stagger: 0.002 }, 2.34);
      tl.set(piece, { autoAlpha: 0 }, 2.6);
      tl.fromTo(
        wordmark,
        { autoAlpha: 0, scale: 0.82 },
        { autoAlpha: 1, scale: 1, duration: 0.62, ease: "power3.out" },
        2.36
      );
      tl.fromTo(labels[0], { autoAlpha: 0, y: 26 }, { autoAlpha: 1, y: 0, duration: 0.52, ease: "power3.out" }, 2.42);
      tl.fromTo(labels[1], { autoAlpha: 0, y: 26 }, { autoAlpha: 1, y: 0, duration: 0.52, ease: "power3.out" }, 3.3);

      // — Scene 4 (4.15–5.36): "dentro" said with geometry — a brightening ring
      //   propagating outward from the two service cells. Finite, deterministic. —
      tl.to(mosaic, { opacity: 0.38, duration: 0.34, ease: "power2.out" }, 4.18);
      tl.to(mosaic, { opacity: 0.08, duration: 0.72, ease: "power2.inOut" }, 4.56);
      for (var m = 0; m < neighbours.length; m++) {
        tl.to(neighbours[m].el, { opacity: 1, duration: 0.26, ease: "power2.out" }, 4.2 + neighbours[m].d * 0.11);
      }

      // — Scene 5 (5.36–6.86): held read. —

      window.__timelines["02-pieza"] = tl;
    })();
  </script>
</template>
