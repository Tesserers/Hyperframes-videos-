<template>
  <style>
    @font-face { font-family: "Ailerons"; src: url("assets/fonts/Ailerons.otf") format("opentype"); font-weight: 400; font-style: normal; font-display: block; }
    @font-face { font-family: "Raleway"; src: url("assets/fonts/Raleway-200.woff2") format("woff2"); font-weight: 200; font-style: normal; font-display: block; }
    @font-face { font-family: "Raleway"; src: url("assets/fonts/Raleway-600.woff2") format("woff2"); font-weight: 600; font-style: normal; font-display: block; }

    #root {
      position: absolute; inset: 0; overflow: hidden;
      --deep: #0a1a1c; --teal: #587579; --teal-lt: #6e9195;
      --beige: #f0e8de; --yellow: #fbe0a0;
    }
    /* No opaque ground here: the hoisted footage IS this frame's ground. */
    .ci-ground { position: absolute; inset: 0; background: transparent; }
    .ci-video { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; }
    .ci-overlay { position: absolute; inset: 0; background: rgba(10, 26, 28, 0.58); }
    .ci-grain {
      position: absolute; inset: 0; opacity: 0.05; background-size: 200px;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
    }

    .ci-wordmark {
      position: absolute; left: 0; top: 372px; width: 1920px; text-align: center;
      font-family: "Ailerons", sans-serif; font-weight: 400; font-size: 186px; line-height: 1;
      text-transform: uppercase; letter-spacing: 0.06em; color: var(--beige);
    }
    .ci-ch { display: inline-block; }
    .ci-tag {
      position: absolute; left: 0; top: 668px; width: 1920px; text-align: center;
      font-family: "Raleway", sans-serif; font-weight: 200; font-size: 50px; color: rgba(240,232,222,0.86);
      letter-spacing: 0.02em;
    }
    .ci-domain {
      position: absolute; left: 0; top: 790px; width: 1920px; text-align: center;
      font-family: "Raleway", sans-serif; font-weight: 600; font-size: 27px;
      letter-spacing: 0.24em; text-transform: uppercase; color: var(--yellow);
    }
    .ci-fade { position: absolute; inset: 0; background: var(--deep); }
    .msk { display: inline-block; overflow: hidden; vertical-align: bottom; padding-bottom: 0.16em; margin-bottom: -0.16em; }
    .msk > span { display: inline-block; }
    .msk-caps { padding-bottom: 0.02em; margin-bottom: -0.02em; }
    /* A shaped scrim, not a flat veil: it darkens only where the type sits, so the
       corners keep the client's footage and the brand teal still passes contrast. */
    .ci-scrim { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 70% 54% at 50% 50%, rgba(10,26,28,0.86) 0%, rgba(10,26,28,0.52) 60%, rgba(10,26,28,0) 84%); }
  </style>

  <div id="root" data-composition-id="07-cierre" data-width="1920" data-height="1080" data-duration="4.7">
    <div id="ci-ground" class="clip ci-ground" data-start="0" data-duration="4.7" data-track-index="0"></div>

    <!-- approved frame video hoisted by assemble-index -->

    <div id="ci-treat" class="clip ci-treat" data-start="0" data-duration="4.7" data-track-index="2">
      <div class="ci-overlay"></div>
      <div class="ci-grain"></div>
    </div>

    <div id="ci-lockup" class="clip ci-lockup" data-start="0" data-duration="4.7" data-track-index="3">
      <div class="ci-scrim"></div>
      <div class="ci-scrim"></div>
      <div class="ci-wordmark" id="ci-wordmark"></div>
      <div class="ci-tag" id="ci-tag">Better decisions, together.</div>
      <div class="ci-domain" id="ci-domain">tesseraservices.com</div>
    </div>

    <div id="ci-fade" class="clip ci-fade" style="opacity:0;visibility:hidden" data-start="0" data-duration="4.7" data-track-index="4"></div>
  </div>

  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="07-cierre"]');
      var wordmark = root.querySelector("#ci-wordmark");
      var chars = [];
      var TXT = "Tessera";
      for (var i = 0; i < TXT.length; i++) {
        var ch = document.createElement("span");
        ch.className = "ci-ch msk"; ch.setAttribute("data-layout-allow-overlap", "");
        var inner = document.createElement("span");
        inner.textContent = TXT[i];
        ch.appendChild(inner);
        wordmark.appendChild(ch);
        chars.push(ch);
      }

      var lockup = root.querySelector("#ci-lockup");
      var tl = gsap.timeline({ paused: true });

      // The logotype resolves once and then holds — this frame has to survive
      // being paused on as a still, so nothing here keeps moving.
      for (var k = 0; k < chars.length; k++) {
        tl.fromTo(chars[k].firstChild, { yPercent: 118 }, { yPercent: 0, duration: 0.95, ease: "expo.out" }, 0.05 + k * 0.05);
      }
      // The lockup settles out of a slow pull — matching the plate, which is
      // pulling back too, so picture and type share one camera.
      tl.fromTo(lockup, { scale: 1.07 }, { scale: 1, duration: 2.6, ease: "power2.out" }, 0);
      
      var tagEl = root.querySelector("#ci-tag"); var tagTxt = tagEl.textContent; tagEl.textContent = "";
      var tagInner = [], tp = tagTxt.split(" ");
      for (var ti = 0; ti < tp.length; ti++) {
        var tw = document.createElement("span"); tw.className = "msk"; tw.setAttribute("data-layout-allow-overlap", "");
        var ts = document.createElement("span"); ts.textContent = tp[ti];
        tw.appendChild(ts); tagEl.appendChild(tw);
        if (ti < tp.length - 1) tagEl.appendChild(document.createTextNode(" "));
        tagInner.push(ts);
      }
      tl.fromTo(tagInner, { yPercent: 118 }, { yPercent: 0, duration: 0.8, ease: "expo.out", stagger: 0.05 }, 0.72);
      tl.fromTo(root.querySelector("#ci-domain"), { autoAlpha: 0, yPercent: 60 }, { autoAlpha: 1, yPercent: 0, duration: 0.62, ease: "expo.out" }, 1.3);

      // The film's only exit.
      tl.set(root.querySelector("#ci-fade"), { autoAlpha: 0 }, 4.0);
      tl.to(root.querySelector("#ci-fade"), { autoAlpha: 1, duration: 0.42, ease: "power2.in" }, 4.28);

      window.__timelines["07-cierre"] = tl;
    })();
  </script>
</template>
