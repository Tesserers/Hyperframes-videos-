      <script>
        document.fonts.ready.then(() => {
          const P = window.TinaPencil;
          const $ = (id) => document.getElementById(id);
          const stage = $("bk-stage");

          // titular en letras sueltas para que salten
          const TITLE = "todos los gustos";
          $("bk-title").innerHTML = TITLE.split("").map((c) => (c === " " ? '<span class="bk-sp"></span>' : '<span class="bk-ch">' + c + "</span>")).join("");

          // el resumen: copias en pequeño de los cuatro desayunos ya terminados
          const SLOTS = [[150, 640], [630, 640], [150, 990], [630, 990]];
          const NAMES = ["CAFÉ", "MATCHA", "TOSTADAS", "BOLLERÍA"];
          SLOTS.forEach(([x, y], i) => {
            const c = $("bk-i" + i).cloneNode(true);
            c.querySelectorAll("[id]").forEach((n) => n.removeAttribute("id"));
            c.querySelectorAll(".bk-bub, .bk-crumb, .bk-crumb3, .bk-steam").forEach((n) => n.remove());
            c.setAttribute("id", "bk-m" + i);
            c.setAttribute("class", "bk-mini");
            c.setAttribute("style", "left:" + x + "px;top:" + y + "px");
            $("bk-recap").appendChild(c);
            const l = document.createElement("div");
            l.className = "bk-mlabel";
            l.id = "bk-ml" + i;
            l.textContent = NAMES[i];
            l.setAttribute("style", "left:" + x + "px;top:" + (y + 300) + "px");
            $("bk-recap").appendChild(l);
          });
          // en la copia del cruasán no hay mordisco
          $("bk-m3").querySelectorAll("circle").forEach((n) => n.remove());

          // medidas antes de animar
          const kb = P.box($("bk-kicker"), stage);
          const qb = P.box($("bk-q"), stage);

          const tip = P.make(stage, "bk-tip", "draw");
          const rub = P.make(stage, "bk-rub", "erase");
          const esvg = $("bk-erase");
          const tl = gsap.timeline({ paused: true });

          // todo lo que se dibuja más tarde empieza escondido
          gsap.set(["#bk-i0", "#bk-i1", "#bk-i2", "#bk-i3", "#bk-nam", "#bk-n0", "#bk-n1", "#bk-n2", "#bk-n3", "#bk-u0", "#bk-u1", "#bk-u2", "#bk-u3"], { autoAlpha: 0 });
          gsap.set(["#bk-m0", "#bk-m1", "#bk-m2", "#bk-m3", "#bk-ml0", "#bk-ml1", "#bk-ml2", "#bk-ml3"], { autoAlpha: 0 });

          // cabecera: «desayunos para» a lápiz, «todos los gustos» salta
          P.fly(tl, tip, [1250, 200], [kb.x, kb.y + kb.h * 0.7], 0.0, 0.15);
          P.write(tl, $("bk-kicker"), { t: 0.15, dur: 0.5, pen: tip, box: kb });
          P.fly(tl, tip, [kb.x + kb.w, kb.y + kb.h * 0.5], [1300, 300], 0.65, 0.2, true);
          const rots = [-12, 9, -7, 11, -9, 8, -11, 10, -8, 12, -10, 9, -12, 8];
          tl.fromTo("#bk-title .bk-ch", { autoAlpha: 0, y: 90, scale: 0.4, rotation: (i) => rots[i % rots.length] },
            { autoAlpha: 1, y: 0, scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2.2)", stagger: 0.03 }, 0.7);

          // los granitos llegan y botan a ritmo hasta el final
          tl.fromTo(["#bk-b0", "#bk-b1"], { autoAlpha: 0, scale: 0.2 }, { autoAlpha: 1, scale: 1, duration: 0.4, ease: "back.out(2)", stagger: 0.1 }, 0.9);
          for (let k = 0; k < 16; k++) {
            const t = 1.25 + k * 0.5;
            const b = k % 2 ? "#bk-b1" : "#bk-b0";
            tl.to(b, { y: -50, scaleY: 1.06, scaleX: 0.95, rotation: k % 4 < 2 ? -8 : 8, duration: 0.2, ease: "power2.out", transformOrigin: "50% 100%" }, t);
            tl.to(b, { y: 0, scaleY: 1, scaleX: 1, rotation: 0, duration: 0.2, ease: "power2.in" }, t + 0.2);
          }
          [2.1, 4.6, 7.1].forEach((t) => tl.to(".bk-eyes", { scaleY: 0.12, duration: 0.07, ease: "none", yoyo: true, repeat: 1, transformOrigin: "50% 74px" }, t));

          // ---- los cuatro desayunos ------------------------------------------------
          const ER = { x0: 60, y0: 600, x1: 1020, y1: 1500, w: 420 };
          const erStart = P.zigzag(ER.x0, ER.y0, ER.x1, ER.y1, ER.w)[0];
          for (let i = 0; i < 4; i++) {
            const T = 1.25 + 1.5 * i;
            const item = "#bk-i" + i;
            const main = $("bk-o" + i);
            // el contorno principal del tostado vive en un grupo girado: su lápiz
            // sigue el trazo sin el giro, que es pequeño (8°)
            const off = i === 2 ? { ox: 240 + 70, oy: 640 + 170 } : { ox: 240, oy: 640 };
            const p0 = main.getPointAtLength(0);
            tl.set(item, { autoAlpha: 1 }, T);
            P.fly(tl, tip, [1250, 300], [off.ox + p0.x, off.oy + p0.y], T - 0.2, 0.2);
            P.trace(tl, main, { t: T, dur: 0.45, pen: tip, ox: off.ox, oy: off.oy, s: 1, samples: 22 });
            P.fly(tl, tip, [off.ox + p0.x, off.oy + p0.y], [1320, 420], T + 0.45, 0.2, true);
            document.querySelectorAll(item + " .bk-ol" + i).forEach((p) => {
              const L = p.getTotalLength();
              tl.fromTo(p, { strokeDasharray: L + 1, strokeDashoffset: L + 1 }, { strokeDashoffset: 0, duration: 0.4, ease: "power1.inOut" }, T + 0.05);
            });
            tl.fromTo(item + " .bk-fill", { autoAlpha: 0, scale: 0.86, transformOrigin: "50% 50%" }, { autoAlpha: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, T + 0.28);
            tl.fromTo("#bk-n" + i, { autoAlpha: 0, y: 70, scale: 0.6 }, { autoAlpha: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(2)" }, T + 0.3);
            tl.fromTo("#bk-u" + i, { autoAlpha: 0, y: 40 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "power3.out" }, T + 0.45);

            // la goma lo borra todo de un plumazo
            P.fly(tl, rub, [1250, 500], erStart, T + 0.97, 0.18);
            P.scribble(tl, { svg: esvg, pen: rub, ...ER, color: "#FAF4E6", t: T + 1.15, dur: 0.3, filter: "bk-rough", hideAt: T + 1.46 });
            P.fly(tl, rub, [1300, 1600], [1350, 2200], T + 1.45, 0.15, true);
            tl.set([item, "#bk-n" + i, "#bk-u" + i], { autoAlpha: 0 }, T + 1.45);
          }

          // café: el vapor se dibuja y sube, la taza da dos saltitos
          tl.fromTo("#bk-i0 .bk-steam", { strokeDasharray: 240, strokeDashoffset: 240, y: 0, autoAlpha: 1 }, { strokeDashoffset: 0, duration: 0.4, ease: "power1.out", stagger: 0.08 }, 1.6);
          tl.to("#bk-i0 .bk-steam", { y: -60, autoAlpha: 0, duration: 0.45, ease: "power1.in", stagger: 0.06 }, 2.05);
          [1.75, 2.25].forEach((t) => {
            tl.to("#bk-i0", { y: -36, rotation: -4, duration: 0.16, ease: "power2.out" }, t);
            tl.to("#bk-i0", { y: 0, rotation: 0, duration: 0.18, ease: "power2.in" }, t + 0.16);
          });
          tl.to("#bk-heart0", { scale: 1.25, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 3, transformOrigin: "50% 50%" }, 1.85);

          // matcha: el batidor bate, salen burbujas, late la espuma
          tl.fromTo("#bk-whisk", { x: 0, rotation: 0 }, { x: 34, rotation: 8, duration: 0.06, ease: "sine.inOut", yoyo: true, repeat: 9, transformOrigin: "440px 120px" }, 3.25);
          tl.fromTo("#bk-i1 .bk-bub", { y: 0, autoAlpha: 1, scale: 1 }, { y: -90, autoAlpha: 0, scale: 0.4, duration: 0.5, ease: "power1.out", stagger: 0.1 }, 3.3);
          tl.to("#bk-heart1", { scale: 1.2, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1, transformOrigin: "50% 50%" }, 3.75);
          tl.fromTo("#bk-i1 .bk-leaf", { scale: 0, rotation: -30, transformOrigin: "60px 120px" }, { scale: 1, rotation: 0, duration: 0.35, ease: "back.out(2)" }, 3.0);

          // tostadas: saltan como de la tostadora, cae la mantequilla, migas
          tl.to("#bk-toastA", { y: -90, rotation: -6, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1 }, 4.75);
          tl.to("#bk-toastB", { y: -110, rotation: 6, duration: 0.2, ease: "power2.out", yoyo: true, repeat: 1 }, 4.8);
          tl.fromTo("#bk-butter", { y: -380, rotation: -30, autoAlpha: 1 }, { y: 0, rotation: 0, duration: 0.28, ease: "power2.in" }, 4.95);
          tl.to("#bk-butter", { scaleY: 0.72, scaleX: 1.16, duration: 0.08, ease: "power1.out", yoyo: true, repeat: 1, transformOrigin: "205px 374px" }, 5.23);
          tl.fromTo("#bk-i2 .bk-crumb", { x: 0, y: 0, rotation: 0, autoAlpha: 0 }, { x: (i) => [-60, 10, 70][i], y: (i) => [-90, -120, -80][i], rotation: 180, autoAlpha: 1, duration: 0.3, ease: "power2.out" }, 5.25);

          // bollería: el cruasán se menea y… ¡ñam!
          tl.fromTo("#bk-croissant", { rotation: 0 }, { rotation: -6, duration: 0.12, ease: "sine.inOut", yoyo: true, repeat: 3, transformOrigin: "300px 300px" }, 6.25);
          tl.fromTo("#bk-bite", { scale: 0, transformOrigin: "555px 420px" }, { scale: 1, duration: 0.18, ease: "back.out(3)" }, 6.75);
          tl.fromTo("#bk-i3 .bk-crumb3", { x: 0, y: 0, autoAlpha: 0, rotation: 0 }, { x: (i) => [30, 70, 60][i], y: (i) => [-60, -20, -100][i], rotation: 160, autoAlpha: 1, duration: 0.3, ease: "power2.out" }, 6.78);
          tl.fromTo("#bk-nam", { autoAlpha: 0, scale: 0.3, rotation: -20 }, { autoAlpha: 1, scale: 1, rotation: 8, duration: 0.25, ease: "back.out(3)" }, 6.8);
          tl.set("#bk-nam", { autoAlpha: 0 }, 7.7);

          // ---- resumen: los cuatro a la vez ----------------------------------------
          for (let i = 0; i < 4; i++) {
            const t = 7.25 + i * 0.25;
            tl.fromTo("#bk-m" + i, { autoAlpha: 0, scale: 0.2, rotation: i % 2 ? 20 : -20, transformOrigin: "50% 50%" }, { autoAlpha: 1, scale: 1, rotation: 0, duration: 0.35, ease: "back.out(2.4)" }, t);
            tl.fromTo("#bk-ml" + i, { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: "power3.out" }, t + 0.1);
            [8.25, 8.75].forEach((h, k) => {
              tl.to("#bk-m" + i, { y: -40, rotation: (i + k) % 2 ? 6 : -6, duration: 0.14, ease: "power2.out" }, h + i * 0.06);
              tl.to("#bk-m" + i, { y: 0, rotation: 0, duration: 0.16, ease: "power2.in" }, h + 0.14 + i * 0.06);
            });
          }
          P.fly(tl, tip, [1250, 1700], [qb.x, qb.y + qb.h * 0.7], 7.4, 0.2);
          P.write(tl, $("bk-q"), { t: 7.6, dur: 0.7, pen: tip, box: qb });
          P.fly(tl, tip, [qb.x + qb.w, qb.y + qb.h * 0.5], [1320, 1900], 8.3, 0.2, true);

          window.__timelines["breakfast"] = tl;
        });
