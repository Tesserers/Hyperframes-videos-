<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        /* Llega coloreado a chocolate por el lápiz de la capa de transiciones. */
        #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--choc); }
        .hr-stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
        .hr-frame { position: absolute; left: 24px; top: 24px; width: 1032px; height: 1872px; border: 2px solid var(--cream); border-radius: 4px; }
        .hr-snow { position: absolute; inset: 0; }
        .hr-flake { position: absolute; opacity: 0.22; }
        .hr-flake path { fill: none; stroke: var(--cream); stroke-width: 3; stroke-linecap: round; }

        .hr-kwrap { position: absolute; left: 60px; top: 450px; width: 960px; text-align: center; }
        .hr-kicker { display: inline-block; font-family: var(--f-display); font-style: italic; font-weight: 300; font-size: 72px; line-height: 1.1; color: var(--butter); }
        .hr-title { position: absolute; left: 60px; top: 534px; width: 960px; text-align: center; font-family: var(--f-display); font-weight: 900; font-size: 210px; line-height: 1.0; letter-spacing: -0.015em; color: var(--cream); white-space: nowrap; }
        .hr-ch { display: inline-block; }
        .hr-wave { position: absolute; left: 260px; top: 780px; width: 560px; height: 40px; overflow: visible; }
        .hr-wave path { fill: none; stroke: rgba(242, 227, 192, 0.5); stroke-width: 4; stroke-linecap: round; }
        .hr-rows { position: absolute; left: 60px; top: 870px; width: 960px; text-align: center; }
        .hr-row { display: block; margin-bottom: 44px; }
        .hr-label { display: block; font-family: var(--f-mono); font-weight: 500; font-size: 26px; letter-spacing: 4px; color: rgba(242, 227, 192, 0.75); }
        .hr-time { display: block; margin-top: 8px; font-family: var(--f-display); font-weight: 400; font-size: 84px; line-height: 1.05; color: var(--cream); font-variant-numeric: lining-nums tabular-nums; }
      </style>

      <div id="root" data-composition-id="hours" data-width="1080" data-height="1920" data-duration="3.65">
        <div id="hr-stage" class="hr-stage">
          <div id="hr-snow" class="hr-snow"></div>
          <div class="hr-frame"></div>
          <div class="hr-kwrap"><span id="hr-kicker" class="hr-kicker">nuestro horario de</span></div>
          <div id="hr-title" class="hr-title"><span class="hr-ch">I</span><span class="hr-ch">n</span><span class="hr-ch">v</span><span class="hr-ch">i</span><span class="hr-ch">e</span><span class="hr-ch">r</span><span class="hr-ch">n</span><span class="hr-ch">o</span></div>
          <svg class="hr-wave" viewBox="0 0 560 40" aria-hidden="true"><path id="hr-wave-p" d="M10 20 C 60 0, 100 40, 150 20 S 240 0, 290 20 S 380 40, 430 20 S 520 0, 550 20" /></svg>
          <div class="hr-rows">
            <span id="hr-r1" class="hr-row"><span class="hr-label">ENTRE SEMANA</span><span class="hr-time">08:00 – 20:00</span></span>
            <span id="hr-r2" class="hr-row"><span class="hr-label">SÁBADO</span><span class="hr-time">10:00 – 22:00</span></span>
            <span id="hr-r3" class="hr-row"><span class="hr-label">DOMINGO</span><span class="hr-time">10:00 – 15:00</span></span>
          </div>
        </div>
      </div>

      <script>
        // Copos con posiciones fijas (sin azar): x, y de salida, tamaño, giro.
        const FLAKES = [
          [96, 120, 46, 10], [262, 300, 34, -14], [470, 60, 40, 22], [690, 240, 52, -8], [930, 110, 38, 16],
          [150, 700, 36, 4], [880, 580, 46, -20], [70, 1180, 50, 12], [960, 1120, 34, -6], [300, 1440, 40, 18],
          [760, 1400, 48, -12], [520, 1620, 36, 8], [180, 1720, 44, -16], [900, 1700, 38, 20],
          [380, 860, 30, 14], [620, 1000, 34, -10], [1000, 820, 28, 6], [40, 420, 32, -12]
        ];
        const snow = document.getElementById("hr-snow");
        FLAKES.forEach(([x, y, s], i) => {
          const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          svg.setAttribute("viewBox", "0 0 40 40");
          svg.setAttribute("class", "hr-flake");
          svg.setAttribute("id", "hr-flake-" + i);
          svg.setAttribute("style", `left:${x}px;top:${y}px;width:${s}px;height:${s}px`);
          svg.innerHTML = '<path d="M20 3 L20 37 M5.3 11.5 L34.7 28.5 M5.3 28.5 L34.7 11.5 M15 6 L20 10 L25 6 M15 34 L20 30 L25 34" />';
          snow.appendChild(svg);
        });

        document.fonts.ready.then(() => {
          const P = window.TinaPencil;
          const $ = (id) => document.getElementById(id);
          const stage = $("hr-stage");
          const kb = P.box($("hr-kicker"), stage);
          const tip = P.make(stage, "hr-tip", "draw");
          const tl = gsap.timeline({ paused: true });

          // nieve que cae con ganas, girando
          FLAKES.forEach(([x, y, s, r], i) => {
            tl.fromTo("#hr-flake-" + i, { y: -60, x: 0, rotation: 0, scale: 0 },
              { y: 360 + (i % 4) * 60, x: (i % 2 ? 40 : -40), rotation: r * 9, scale: 1, duration: 3.6, ease: "none" }, 0.05 + (i % 6) * 0.04);
          });

          // «nuestro horario de» a lápiz, «Invierno» salta, ondita a lápiz
          P.fly(tl, tip, [1250, 300], [kb.x, kb.y + kb.h * 0.7], 0.0, 0.15);
          P.write(tl, $("hr-kicker"), { t: 0.15, dur: 0.5, pen: tip, box: kb });
          const rots = [-12, 9, -7, 11, -9, 8, -11, 10];
          tl.fromTo("#hr-title .hr-ch", { autoAlpha: 0, y: 120, scale: 0.4, rotation: (i) => rots[i] },
            { autoAlpha: 1, y: 0, scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2.2)", stagger: 0.04 }, 0.7);
          P.trace(tl, $("hr-wave-p"), { t: 0.95, dur: 0.3, pen: tip, ox: 260, oy: 780, s: 1 });
          P.fly(tl, tip, [810, 800], [1340, 1100], 1.25, 0.2, true);

          // las tres franjas entran a ritmo, alternando lado
          ["#hr-r1", "#hr-r2", "#hr-r3"].forEach((r, i) => {
            tl.fromTo(r, { autoAlpha: 0, x: i % 2 ? 160 : -160, rotation: i % 2 ? 3 : -3 }, { autoAlpha: 1, x: 0, rotation: 0, duration: 0.4, ease: "back.out(1.8)" }, 1.25 + i * 0.25);
          });
          [2.25, 2.75].forEach((t) => tl.to("#hr-title", { scale: 1.05, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, t));

          window.__timelines["hours"] = tl;
        });
      </script>
    </template>
  </body>
</html>
