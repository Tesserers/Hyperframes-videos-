<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        /* Capa de transiciones, por encima de todas las escenas. En cada costura
           el lápiz colorea el cuadro entero con el fondo de la escena siguiente,
           o la goma lo deja en blanco cuando el fondo no cambia. Al terminar el
           trazo, la escena de debajo ya es la nueva y el garabato desaparece en
           el mismo fotograma: como es del mismo color, el cambio no se ve. */
        #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
        .pc-svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
      </style>

      <div id="root" data-composition-id="pencil" data-width="1080" data-height="1920" data-duration="26">
        <svg id="pc-svg" class="pc-svg" viewBox="0 0 1080 1920" aria-hidden="true">
          <defs>
            <filter id="pc-rough" x="-10%" y="-10%" width="120%" height="120%">
              <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="n" />
              <feDisplacementMap in="SourceGraphic" in2="n" scale="34" xChannelSelector="R" yChannelSelector="G" />
            </filter>
          </defs>
        </svg>
      </div>

      <script>
        const P = window.TinaPencil;
        const svg = document.getElementById("pc-svg");
        const root = svg.parentNode;
        const tip = P.make(root, "pc-tip", "draw");
        const rub = P.make(root, "pc-rub", "erase");
        const tl = gsap.timeline({ paused: true });

        // [inicio, duración, color, lápiz]  — el corte cae justo al acabar el trazo
        const SEAMS = [
          [5.0, 0.75, "#FAF4E6", tip],  // gancho → desayunos: colorea a hueso
          [15.0, 0.4, "#FAF4E6", rub],  // desayunos → promos: goma
          [19.0, 0.75, "#5C3A1E", tip], // promos → horario: colorea a chocolate
          [23.0, 0.4, "#5C3A1E", rub],  // horario → cierre: goma
        ];
        SEAMS.forEach(([t, d, color, pen], i) => {
          P.fly(tl, pen, [1250, -260], [-120, -40], t - 0.22, 0.22);
          P.scribble(tl, { svg, pen, x0: 0, y0: 0, x1: 1080, y1: 1920, w: 430, color, t, dur: d, filter: "pc-rough", id: "pc-s" + i, hideAt: t + d });
          P.fly(tl, pen, [1300, 2080], [1350, 2400], t + d, 0.2, true);
        });
        window.__timelines["pencil"] = tl;
      </script>
    </template>
  </body>
</html>
