<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--bone); }
        .pr-stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
        .pr-frame { position: absolute; left: 24px; top: 24px; width: 1032px; height: 1872px; border: 2px solid var(--choc); border-radius: 4px; }
        .pr-hwrap { position: absolute; left: 60px; top: 300px; width: 960px; text-align: center; }
        .pr-head { display: inline-block; font-family: var(--f-display); font-style: italic; font-weight: 300; font-size: 72px; line-height: 1.1; color: var(--caramel); }

        /* El borde de cada tarjeta no es CSS: lo dibuja el lápiz en .pr-lines. */
        .pr-card { position: absolute; left: 90px; width: 900px; padding: 40px 56px 0; }
        .pr-card-2 { top: 520px; height: 290px; }
        .pr-card-3 { top: 850px; height: 400px; }
        .pr-bg3 { position: absolute; left: 90px; top: 850px; width: 900px; height: 400px; background: var(--choc); }
        .pr-label { display: block; font-family: var(--f-mono); font-weight: 500; font-size: 26px; letter-spacing: 3px; color: var(--caramel); }
        .pr-title { display: block; margin-top: 18px; font-family: var(--f-display); font-weight: 900; font-size: 100px; line-height: 1.0; letter-spacing: -0.01em; color: var(--choc); white-space: nowrap; }
        .pr-card-3 .pr-label { color: rgba(242, 227, 192, 0.75); }
        .pr-card-3 .pr-title { color: var(--cream); }
        .pr-row { display: flex; align-items: baseline; justify-content: space-between; margin-top: 34px; }
        .pr-sub { font-family: var(--f-display); font-style: italic; font-weight: 300; font-size: 52px; color: var(--cream); }
        .pr-price { display: block; font-family: var(--f-display); font-weight: 900; font-size: 116px; line-height: 1; color: var(--butter); }
        .pr-heart { position: absolute; right: 50px; top: 46px; width: 40px; height: 36px; }
        .pr-lines { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
        .pr-lines .pr-box { fill: none; stroke: var(--choc); stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
      </style>

      <div id="root" data-composition-id="promos" data-width="1080" data-height="1920" data-duration="4.35">
        <div id="pr-stage" class="pr-stage">
          <div class="pr-frame"></div>
          <div class="pr-hwrap"><span id="pr-head" class="pr-head">para cada momento —</span></div>

          <div id="pr-bg3" class="pr-bg3"></div>
          <svg id="pr-lines" class="pr-lines" viewBox="0 0 1080 1920" aria-hidden="true">
            <defs>
              <clipPath id="pr-clip3"><rect x="90" y="850" width="900" height="400" /></clipPath>
              <filter id="pr-rough" x="-10%" y="-10%" width="120%" height="120%">
                <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="5" result="n" />
                <feDisplacementMap in="SourceGraphic" in2="n" scale="22" xChannelSelector="R" yChannelSelector="G" />
              </filter>
            </defs>
            <g id="pr-fill3" clip-path="url(#pr-clip3)"></g>
            <path id="pr-box2" class="pr-box" d="M90 522 L988 520 L990 810 L92 808 Z" />
            <path id="pr-box3" class="pr-box" d="M90 852 L990 850 L988 1250 L92 1248 Z" />
          </svg>

          <div id="pr-c2" class="pr-card pr-card-2">
            <span class="pr-label">MARTES A VIERNES · 14–16 H</span>
            <span class="pr-title">Hora Aperol</span>
          </div>
          <div id="pr-c3" class="pr-card pr-card-3">
            <span class="pr-label">PARA ESTUDIANTES</span>
            <span class="pr-title">Hora del Recreo</span>
            <div class="pr-row">
              <span class="pr-sub">pincho + bebida</span>
              <span id="pr-price" class="pr-price">3,50 €</span>
            </div>
            <svg id="pr-heart" class="pr-heart" viewBox="0 0 44 40" aria-hidden="true"><path d="M22 38 C 22 38, 2 25, 2 12 C 2 5, 8 1, 13 1 C 17 1, 20 4, 22 7 C 24 4, 27 1, 31 1 C 36 1, 42 5, 42 12 C 42 25, 22 38, 22 38 Z" fill="#C97A5C" /></svg>
          </div>
        </div>
      </div>

      <script>
        document.fonts.ready.then(() => {
          const P = window.TinaPencil;
          const $ = (id) => document.getElementById(id);
          const stage = $("pr-stage");
          const hb = P.box($("pr-head"), stage);
          const tip = P.make(stage, "pr-tip", "draw");
          const tl = gsap.timeline({ paused: true });

          gsap.set(["#pr-c2", "#pr-c3", "#pr-bg3"], { autoAlpha: 0 });

          // cabecera escrita
          P.fly(tl, tip, [1250, 200], [hb.x, hb.y + hb.h * 0.7], 0.0, 0.1);
          P.write(tl, $("pr-head"), { t: 0.1, dur: 0.45, pen: tip, box: hb });

          // dos tarjetas: el lápiz dibuja el marco y el contenido salta dentro
          [2, 3].forEach((k, i) => {
            const t = 0.55 + i * 0.45;
            P.trace(tl, $("pr-box" + k), { t, dur: 0.32, pen: tip, ox: 0, oy: 0, s: 1, samples: 8 });
            // la tercera espera a estar coloreada: su texto es crema
            const c = k === 3 ? 2.2 : t + 0.2;
            tl.fromTo("#pr-c" + k + " .pr-label", { autoAlpha: 0, x: -40 }, { autoAlpha: 1, x: 0, duration: 0.3, ease: "power3.out" }, c);
            tl.fromTo("#pr-c" + k + " .pr-title", { autoAlpha: 0, y: 50, scale: 0.7, transformOrigin: "0% 100%" }, { autoAlpha: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(2)" }, c + 0.06);
            tl.set("#pr-c" + k, { autoAlpha: 1 }, c);
          });

          // la tercera se colorea a chocolate con el mismo lápiz
          P.scribble(tl, { svg: $("pr-fill3"), pen: tip, x0: 90, y0: 850, x1: 990, y1: 1250, w: 190, color: "#5C3A1E", t: 1.9, dur: 0.3, filter: "pr-rough", hideAt: 2.2 });
          tl.set("#pr-bg3", { autoAlpha: 1 }, 2.2);
          P.fly(tl, tip, [1000, 1250], [1340, 1900], 2.2, 0.2, true);

          // el precio cae como un sello, el corazón late a ritmo
          tl.fromTo("#pr-price", { autoAlpha: 0, scale: 2.4, rotation: -14 }, { autoAlpha: 1, scale: 1, rotation: -4, duration: 0.22, ease: "power4.in", transformOrigin: "100% 80%" }, 2.45);
          tl.to("#pr-c3", { y: 8, duration: 0.06, ease: "power1.out", yoyo: true, repeat: 1 }, 2.67);
          tl.fromTo("#pr-heart", { scale: 0, rotation: -20 }, { scale: 1, rotation: 0, duration: 0.35, ease: "back.out(2)" }, 2.7);
          [3.1, 3.6].forEach((t) => tl.to("#pr-heart", { scale: 1.3, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, t));

          // ola de saltitos por las dos tarjetas, a ritmo
          [3.0, 3.5].forEach((t) => {
            ["#pr-c2", "#pr-c3"].forEach((c, i) => {
              tl.to(c, { y: -14, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, t + i * 0.08);
            });
          });

          window.__timelines["promos"] = tl;
        });
      </script>
    </template>
  </body>
</html>
