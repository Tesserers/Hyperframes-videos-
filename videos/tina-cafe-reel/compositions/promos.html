<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--bone); }
        .pr-frame { position: absolute; left: 24px; top: 24px; width: 1032px; height: 1872px; border: 2px solid var(--choc); border-radius: 4px; }
        .pr-head { position: absolute; left: 60px; top: 300px; width: 960px; text-align: center; font-family: var(--f-display); font-style: italic; font-weight: 300; font-size: 72px; line-height: 1.1; color: var(--caramel); }

        .pr-card { position: absolute; left: 90px; width: 900px; padding: 40px 56px 0; border: 2px solid var(--choc); border-radius: 4px; background: var(--bone); }
        .pr-card-1 { top: 440px; height: 290px; }
        .pr-card-2 { top: 770px; height: 290px; }
        .pr-card-3 { top: 1100px; height: 400px; background: var(--choc); border-color: var(--choc); }
        .pr-label { display: block; font-family: var(--f-mono); font-weight: 500; font-size: 26px; letter-spacing: 3px; color: var(--caramel); }
        .pr-title { display: block; margin-top: 18px; font-family: var(--f-display); font-weight: 900; font-size: 100px; line-height: 1.0; letter-spacing: -0.01em; color: var(--choc); white-space: nowrap; }
        .pr-rule { display: block; width: 120px; height: 2px; margin-top: 30px; background: var(--gold); }
        .pr-card-3 .pr-label { color: rgba(242, 227, 192, 0.75); }
        .pr-card-3 .pr-title { color: var(--cream); }
        .pr-row { display: flex; align-items: baseline; justify-content: space-between; margin-top: 34px; }
        .pr-sub { font-family: var(--f-display); font-style: italic; font-weight: 300; font-size: 52px; color: var(--cream); }
        .pr-price { display: block; font-family: var(--f-display); font-weight: 900; font-size: 116px; line-height: 1; color: var(--butter); }
        .pr-heart { position: absolute; right: 50px; top: 46px; width: 40px; height: 36px; }
      </style>

      <div id="root" data-composition-id="promos" data-width="1080" data-height="1920" data-duration="4.05">
        <div id="pr-head" class="pr-head">para cada momento —</div>

        <div id="pr-c1" class="pr-card pr-card-1" data-layout-allow-overlap>
          <span class="pr-label">MARTES A VIERNES · 12–14 H</span>
          <span class="pr-title">Hora Reposada</span>
          <span class="pr-rule"></span>
        </div>
        <div id="pr-c2" class="pr-card pr-card-2">
          <span class="pr-label">MARTES A VIERNES · 14–16 H</span>
          <span class="pr-title">Hora Aperol</span>
          <span class="pr-rule"></span>
        </div>
        <div id="pr-c3" class="pr-card pr-card-3">
          <span class="pr-label">PARA ESTUDIANTES</span>
          <span class="pr-title">Hora del Recreo</span>
          <div class="pr-row">
            <span class="pr-sub">pincho + bebida</span>
            <span id="pr-price" class="pr-price">3,50 €</span>
          </div>
          <svg id="pr-heart" class="pr-heart" viewBox="0 0 44 40" aria-hidden="true"><path d="M22 38 C 22 38, 2 25, 2 12 C 2 5, 8 1, 13 1 C 17 1, 20 4, 22 7 C 24 4, 27 1, 31 1 C 36 1, 42 5, 42 12 C 42 25, 22 38, 22 38 Z" fill="#C97A5C" /></svg>
        </div>

        <div class="pr-frame"></div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });
        // todo llega desde abajo, ya en marcha: recoge el impulso con el que salió la taza
        tl.fromTo("#pr-head", { autoAlpha: 0, y: 160 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power4.out" }, 0);
        tl.fromTo(["#pr-c1", "#pr-c2", "#pr-c3"], { autoAlpha: 0, y: 380, rotation: -1.5 }, { autoAlpha: 1, y: 0, rotation: 0, duration: 0.75, ease: "power4.out", stagger: 0.42 }, 0.1);
        tl.fromTo("#pr-c1 .pr-rule, #pr-c2 .pr-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out", transformOrigin: "0% 50%", stagger: 0.42 }, 0.55);
        // el precio, con su pausa antes
        tl.fromTo("#pr-price", { autoAlpha: 0, scale: 0.6 }, { autoAlpha: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)", transformOrigin: "100% 80%" }, 1.55);
        tl.fromTo("#pr-heart", { scale: 0, rotation: -20 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(1.7)" }, 1.8);
        tl.to("#pr-heart", { scale: 1.18, duration: 0.18, ease: "power1.out", yoyo: true, repeat: 3 }, 2.4);
        window.__timelines["promos"] = tl;
      </script>
    </template>
  </body>
</html>
