<!doctype html>
<html
  lang="es"
  data-composition-variables='[
    {"id":"instagram","type":"string","label":"Usuario de Instagram","default":"@[pendiente]","placeholder":"@tresdamasevents"},
    {"id":"musica","type":"string","label":"Música (ruta del archivo)","default":"assets/audio/musica.mp3"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Tres Damas Events — Reel cañero</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Cormorant Garamond"; src: url("assets/fonts/CormorantGaramond-italic.woff2") format("woff2"); font-style: italic; font-weight: 300 700; font-display: block; }
      @font-face { font-family: "Jost"; src: url("assets/fonts/Jost-normal.woff2") format("woff2"); font-style: normal; font-weight: 100 900; font-display: block; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #f6f1e7; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f1e7; }
      .scene { position: absolute; inset: 0; }
      #nota {
        position: absolute; left: 0; right: 0; top: 1606px; display: flex; justify-content: center;
      }
      #nota span {
        display: block; background: #203c32; color: #f6f1e7;
        font-family: "Jost", sans-serif; font-weight: 400; font-size: 17px;
        letter-spacing: 0.24em; text-transform: uppercase; padding: 10px 14px 9px 18px;
      }
      #handle {
        position: absolute; left: 0; right: 0; top: 1262px; text-align: center;
        font-family: "Cormorant Garamond", serif; font-style: italic; font-weight: 400;
        font-size: 52px; line-height: 1.2; color: #652d38;
      }
      /* The photobooth flash: the only transition device in this cut. */
      #flash { position: absolute; inset: 0; background: #f6f1e7; opacity: 0; }
      #fade { position: absolute; inset: 0; background: #f6f1e7; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="25" data-width="1080" data-height="1920">
      <!-- 120 bpm: one beat = 0.5 s. Every cut lands on a beat. Copy stays between y=250 and y=1670. -->
      <div id="el-c1" class="scene" data-composition-id="c1-intro" data-composition-src="compositions/c1-intro.html"
           data-start="0" data-duration="2" data-track-index="0" data-width="1080" data-height="1920"></div>
      <div id="el-c2" class="scene" data-composition-id="c2-drop" data-composition-src="compositions/c2-drop.html"
           data-start="2" data-duration="4" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="el-c3" class="scene" data-composition-id="c3-otra" data-composition-src="compositions/c3-otra.html"
           data-start="6" data-duration="2" data-track-index="0" data-width="1080" data-height="1920"></div>
      <div id="el-c4" class="scene" data-composition-id="c4-cuenta" data-composition-src="compositions/c4-cuenta.html"
           data-start="8" data-duration="4" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="el-c5" class="scene" data-composition-id="c5-montaje" data-composition-src="compositions/c5-montaje.html"
           data-start="12" data-duration="4" data-track-index="0" data-width="1080" data-height="1920"></div>
      <div id="el-c6" class="scene" data-composition-id="c6-manos" data-composition-src="compositions/c6-manos.html"
           data-start="16" data-duration="4" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="el-c7" class="scene" data-composition-id="c7-cierre" data-composition-src="compositions/c7-cierre.html"
           data-start="20" data-duration="5" data-track-index="0" data-width="1080" data-height="1920"></div>

      <div id="nota" class="clip" data-start="2" data-duration="18" data-track-index="2"><span>Imágenes de referencia</span></div>
      <p id="handle" class="clip" data-start="20" data-duration="5" data-track-index="3" data-var-text="instagram">@[pendiente]</p>
      <div id="flash" class="clip" data-start="0" data-duration="25" data-track-index="4"></div>
      <div id="fade" class="clip" data-start="24" data-duration="1" data-track-index="5"></div>

      <!-- Music: original Balearic tech-house cue (assets/audio/fuente/canero.py). -->
      <audio id="musica" src="assets/audio/musica.mp3" data-var-src="musica"
             data-start="0" data-duration="25" data-track-index="9" data-volume="1"
             data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":1},{"t":24.3,"v":1},{"t":25,"v":0}]}]}'></audio>
    </div>

    <script>
      (function () {
        var E = (function (x1, y1, x2, y2) {
          function bx(t) { return 3 * x1 * t * (1 - t) * (1 - t) + 3 * x2 * t * t * (1 - t) + t * t * t; }
          function by(t) { return 3 * y1 * t * (1 - t) * (1 - t) + 3 * y2 * t * t * (1 - t) + t * t * t; }
          return function (x) { if (x <= 0) return 0; if (x >= 1) return 1; var lo = 0, hi = 1, t = x;
            for (var i = 0; i < 30; i++) { t = (lo + hi) / 2; if (bx(t) < x) lo = t; else hi = t; } return by(t); };
        })(0.2, 0.7, 0.2, 1);
        var tl = gsap.timeline({ paused: true });

        // Photobooth flashes on the big hits: drop, "otra foto.", the three booth frames, montage, hands, logo.
        [2, 6, 9.5, 10, 10.5, 12, 16, 20].forEach(function (t) {
          tl.fromTo("#flash", { opacity: 0.92 }, { opacity: 0, duration: 0.28, ease: E, immediateRender: false }, t);
        });
        tl.fromTo("#nota span", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: E }, 2.3);
        tl.fromTo("#handle", { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1, duration: 0.3, ease: E }, 21.5);
        tl.fromTo("#fade", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: E }, 24.3);

        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
