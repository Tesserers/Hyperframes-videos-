<template>
  <style>

  <script>
    (function () {
    // The one curve of the piece: cubic-bezier(.2,.7,.2,1).
    var E = (function (x1, y1, x2, y2) {
      function bx(t) { return 3 * x1 * t * (1 - t) * (1 - t) + 3 * x2 * t * t * (1 - t) + t * t * t; }
      function by(t) { return 3 * y1 * t * (1 - t) * (1 - t) + 3 * y2 * t * t * (1 - t) + t * t * t; }
      return function (x) {
        if (x <= 0) return 0;
        if (x >= 1) return 1;
        var lo = 0, hi = 1, t = x;
        for (var i = 0; i < 30; i++) { t = (lo + hi) / 2; if (bx(t) < x) lo = t; else hi = t; }
        return by(t);
      };
    })(0.2, 0.7, 0.2, 1);
    var DRIFT = "sine.inOut"; // only for long, barely perceptible camera drift

      var tl = gsap.timeline({ paused: true });

      tl.fromTo("#s4-feed", { y: 1420, rotation: -1 }, { y: 0, rotation: -3, duration: 2.4, ease: E }, 0);
      tl.to("#s4-feed", { y: -14, duration: 3.4, ease: DRIFT }, 2.4);

      rise("#s4-caps", 2.1);
      rise("#s4-nota", 2.4, 12);
      window.__timelines["s4-tira"] = tl;
    })();
