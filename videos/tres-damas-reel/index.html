<!doctype html>
<html
  lang="es"
  data-composition-variables='[
    {"id":"instagram","type":"string","label":"Usuario de Instagram","default":"@[pendiente]","placeholder":"@tresdamasevents"},
    {"id":"musica","type":"string","label":"Música (ruta del archivo)","default":"assets/audio/musica.mp3"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Tres Damas Events — Reel</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Cormorant Garamond"; src: url("assets/fonts/CormorantGaramond-italic.woff2") format("woff2"); font-style: italic; font-weight: 300 700; font-display: block; }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #f6f1e7; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f1e7; }
      .scene { position: absolute; inset: 0; }

      /* Instagram handle: sits under the button of s6-cierre (inside the safe band). */
      #handle {
        position: absolute; left: 0; right: 0; top: 1262px;
        text-align: center;
        font-family: "Cormorant Garamond", serif; font-style: italic; font-weight: 400;
        font-size: 52px; line-height: 1.2; color: #652d38;
      }
      #fade { position: absolute; inset: 0; background: #f6f1e7; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="25" data-width="1080" data-height="1920">
      <!-- Instagram covers ~250 px top and bottom: every line of copy sits between y=250 and y=1670. -->

      <div id="el-s1" class="scene" data-composition-id="s1-monograma" data-composition-src="compositions/s1-monograma.html"
           data-start="0" data-duration="3.8" data-track-index="0" data-width="1080" data-height="1920"></div>

      <div id="el-s2" class="scene" data-composition-id="s2-arco" data-composition-src="compositions/s2-arco.html"
           data-start="3" data-duration="4" data-track-index="1" data-width="1080" data-height="1920"></div>

      <div id="el-s3" class="scene" data-composition-id="s3-otra-foto" data-composition-src="compositions/s3-otra-foto.html"
           data-start="7" data-duration="3" data-track-index="0" data-width="1080" data-height="1920"></div>

      <div id="el-s4" class="scene" data-composition-id="s4-tira" data-composition-src="compositions/s4-tira.html"
           data-start="10" data-duration="5.8" data-track-index="1" data-width="1080" data-height="1920"></div>

      <div id="el-s5" class="scene" data-composition-id="s5-tiras" data-composition-src="compositions/s5-tiras.html"
           data-start="15" data-duration="4.8" data-track-index="0" data-width="1080" data-height="1920"></div>

      <div id="el-s6" class="scene" data-composition-id="s6-cierre" data-composition-src="compositions/s6-cierre.html"
           data-start="19" data-duration="6" data-track-index="1" data-width="1080" data-height="1920"></div>

      <!-- Variable "instagram": change it in Studio or with --variables '{"instagram":"@usuario"}'. -->
      <p id="handle" class="clip" data-start="19" data-duration="6" data-track-index="2" data-var-text="instagram">@[pendiente]</p>

      <!-- 7 · Fade to ivory over the last 0.9 s. -->
      <div id="fade" class="clip" data-start="24" data-duration="1" data-track-index="3"></div>

      <!-- Music: empty track (silence) until a calm piano or strings piece is added.
           Replace assets/audio/musica.mp3, or point the "musica" variable at another file.
           Envelope: 1.2 s fade-in, 2 s fade-out. -->
      <audio
        id="musica"
        src="assets/audio/musica.mp3"
        data-var-src="musica"
        data-start="0"
        data-duration="25"
        data-track-index="9"
        data-volume="0.8"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0},{"t":1.2,"v":1},{"t":23,"v":1},{"t":25,"v":0}]}]}'
      ></audio>
    </div>

    <script>
      (function () {
        var tl = gsap.timeline({ paused: true });
        // The one curve of the piece: cubic-bezier(.2,.7,.2,1).
        var E = (function (x1, y1, x2, y2) {
          function bx(t) { return 3 * x1 * t * (1 - t) * (1 - t) + 3 * x2 * t * t * (1 - t) + t * t * t; }
          function by(t) { return 3 * y1 * t * (1 - t) * (1 - t) + 3 * y2 * t * t * (1 - t) + t * t * t; }
          return function (x) {
            if (x <= 0) return 0;
            if (x >= 1) return 1;
            var lo = 0, hi = 1, t = x;
            for (var i = 0; i < 30; i++) { t = (lo + hi) / 2; if (bx(t) < x) lo = t; else hi = t; }
            return by(t);
          };
        })(0.2, 0.7, 0.2, 1);

        // Handle arrives last on the closing card; then the whole frame fades to ivory.
        tl.fromTo("#handle", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.8, ease: E }, 20.7);
        tl.fromTo("#fade", { opacity: 0 }, { opacity: 1, duration: 0.9, ease: E }, 24.1);

        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
